# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from Conventional Commit messages.
# Regenerates from scratch on every run (no --prepend).

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}{% if commit.breaking %} [**BREAKING**]{% endif %} (`{{ commit.id | truncate(length=7, end="") }}`)
{%- if commit.body %}
{%- for line in commit.body | split(pat="\n") %}
{%- if line | trim | length > 0 %}
  {{ line | trim }}
{%- endif %}
{%- endfor %}
{%- endif %}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
    { message = "^feat",     group = "Added"           },
    { message = "^fix",      group = "Fixed"           },
    { message = "^perf",     group = "Performance"     },
    { message = "^refactor", group = "Changed"         },
    { message = "^style",    skip  = true              },
    { message = "^doc",      group = "Documentation"   },
    { message = "^test",     skip  = true              },
    { message = "^chore",    skip  = true              },
    { message = "^build",    skip  = true              },
    { message = "^ci",       skip  = true              },
    { message = "^revert",   group = "Reverted"        },
    { body    = ".*security",group = "Security"        },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
