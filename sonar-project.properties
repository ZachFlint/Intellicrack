# SonarQube Cloud CI-based analysis configuration.
#
# Read by the SonarQube Scan GitHub Action (ci.yml, python-test job), which
# runs after pytest so this file's coverage.python and coverage.js.lcov
# report paths point at files that already exist on disk. Automatic
# analysis (the SonarCloud GitHub App) is turned off for this project since
# it cannot import a coverage report; see
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/ci-based-analysis
#
# Scope mirrors the other analyzers (qodana.yaml, .codeqlignore): vendored
# code, third-party SDKs, type stubs and generated output stay out.

sonar.projectKey=ZachFlint_Intellicrack
sonar.organization=zachflint

# ---------------------------------------------------------------------------
# Production code
# ---------------------------------------------------------------------------
# .github is included so the GitHub Actions security rules run on workflows.
sonar.sources=src,scripts,packaging,docker,.github
sonar.exclusions=\
  src/hexbench/tests/**,\
  src/hexbench/design/cards/**,\
  src/hexbench/design/index.html,\
  src/intellicrack-hexcore/target/**,\
  packaging/version.generated.iss,\
  **/__pycache__/**,\
  **/*.png,\
  **/*.ico

# ---------------------------------------------------------------------------
# Test code (analyzed with test rules, not production rules)
# ---------------------------------------------------------------------------
sonar.tests=tests,src/hexbench/tests
# Fixtures are raw ELF/Mach-O binaries; reading them as text is what produced
# the "problems with file encoding" warning.
sonar.test.exclusions=\
  tests/fixtures/**,\
  **/__pycache__/**

# ---------------------------------------------------------------------------
# Language settings
# ---------------------------------------------------------------------------
# Every tracked text file is UTF-8 (.editorconfig, .gitattributes).
sonar.sourceEncoding=UTF-8

# Matches requires-python in pyproject.toml and the pixi python pin.
sonar.python.version=3.13

# ---------------------------------------------------------------------------
# Test execution and coverage
# ---------------------------------------------------------------------------
# Both generated by `pytest tests/ --cov=src/intellicrack --cov-report=xml
# --junitxml=test-results.xml` in the python-test CI job, ahead of the
# SonarQube Scan step. Coverage import never blocks the pipeline: the CI
# job and the scan step both run with continue-on-error.
sonar.python.coverage.reportPaths=coverage.xml
sonar.junit.reportPaths=test-results.xml

# PowerShell has no coverage report in this pipeline: pytest-cov measures the
# Python it imports, and the monitor and installer scripts run as separate
# powershell.exe processes. Left in, every new PowerShell line counts as
# uncovered however thoroughly the tests drive the script.
sonar.coverage.exclusions=\
  **/*.ps1

# ---------------------------------------------------------------------------
# Duplication
# ---------------------------------------------------------------------------
# Packaging specs and CI workflows repeat boilerplate by design.
sonar.cpd.exclusions=\
  packaging/**,\
  .github/**
