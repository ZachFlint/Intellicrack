name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
      - name: Install dependencies
        run: |
          pixi install
        timeout-minutes: 15
      - name: Generate requirements.txt for Dependabot
        shell: pwsh
        run: |
          pixi list --frozen --json | ConvertFrom-Json | Where-Object { $_.kind -eq 'pypi' } | Sort-Object name | ForEach-Object {
            if ($_.version) {
              "$($_.name)==$($_.version)"
            } else {
              $_.name
            }
          } | Out-File -FilePath requirements.txt -Encoding utf8
        timeout-minutes: 5
  python-lint:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Lint with ruff
        run: |
          pixi run ruff check src/ tests/ --output-format=github
          pixi run ruff format src/ tests/
  python-security:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Security scan with bandit
        run: pixi run bandit -r src/intellicrack/ -f json -o bandit-report.json || true
      - name: Print security results
        if: always()
        shell: python
        run: |
          import json
          import pathlib
          report = pathlib.Path("bandit-report.json")
          if report.exists():
              data = json.loads(report.read_text())
              results = data.get("results", [])
              print(f"Security Issues: {len(results)}")
              for r in results:
                  sev = r.get("issue_severity", "?")
                  conf = r.get("issue_confidence", "?")
                  text = r.get("issue_text", "")
                  fname = r.get("filename", "")
                  line = r.get("line_number", 0)
                  print(f"  [{sev}/{conf}] {fname}:{line} - {text}")
          else:
              print("No bandit report found")
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
  python-typecheck:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Install package in editable mode
        run: pixi run pip install -e .
      - name: Type check with basedpyright
        run: |
          pixi run basedpyright src/
  python-mock-verify:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Verify No Mock Usage (Production-Ready Enforcement)
        run: |
          pixi run python scripts/verify_no_mocks.py --ci
  python-test:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Install package in editable mode
        run: pixi run pip install -e .
      - name: Test with pytest
        run: |
          pixi run pytest tests/ -v --cov=src/intellicrack --cov-report=xml --cov-report=html --junitxml=test-results.xml
        env:
          PYTHONDONTWRITEBYTECODE: 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results.xml
            htmlcov/
            coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-windows-py3.12
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
