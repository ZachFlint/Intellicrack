name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: latest
      - name: Install dependencies
        run: |
          pixi install
        timeout-minutes: 15
      - name: Generate requirements.txt for Dependabot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item requirements.txt -ErrorAction SilentlyContinue
          pixi run python scripts/generate_requirements.py
          if ($LASTEXITCODE -ne 0) { throw 'generate_requirements.py failed' }
          git diff --exit-code -- requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::requirements.txt is out of sync with pixi.lock/pyproject.toml. Run scripts/generate_requirements.py (or let the pre-commit hook do it) and commit the result -- do not edit requirements.txt by hand.'
            exit 1
          }
        timeout-minutes: 5
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.python_diff.outputs.substantive || 'false' }}
      x64dbg: ${{ steps.x64dbg_diff.outputs.substantive || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: shell
          filters: |
            python:
              - 'src/intellicrack/**'
              - 'src/intellicrack-hexcore/**'
              - 'src/x64dbg-plugin/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'pixi.lock'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'
            x64dbg:
              - 'src/x64dbg-plugin/**'
              - '.github/workflows/ci.yml'
      - name: Classify python-relevant changes as substantive or comment-only
        if: steps.filter.outputs.python == 'true'
        id: python_diff
        uses: ./.github/actions/comment-only-diff
        with:
          paths: ${{ steps.filter.outputs.python_files }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - name: Classify x64dbg-relevant changes as substantive or comment-only
        if: steps.filter.outputs.x64dbg == 'true'
        id: x64dbg_diff
        uses: ./.github/actions/comment-only-diff
        with:
          paths: ${{ steps.filter.outputs.x64dbg_files }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  python-lint:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Lint with ruff
        run: |
          pixi run ruff check src/ tests/ --output-format=github
          pixi run ruff format --check --diff src/ tests/
  python-security:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Security scan with bandit
        run: pixi run bandit -r src/intellicrack/ -f json -o bandit-report.json || true
      - name: Print security results
        if: always()
        shell: python
        run: |
          import json
          import pathlib
          report = pathlib.Path("bandit-report.json")
          if report.exists():
              data = json.loads(report.read_text())
              results = data.get("results", [])
              print(f"Security Issues: {len(results)}")
              for r in results:
                  sev = r.get("issue_severity", "?")
                  conf = r.get("issue_confidence", "?")
                  text = r.get("issue_text", "")
                  fname = r.get("filename", "")
                  line = r.get("line_number", 0)
                  print(f"  [{sev}/{conf}] {fname}:{line} - {text}")
          else:
              print("No bandit report found")
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json
  python-typecheck:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Install package in editable mode
        run: pixi run pip install -e .
      - name: Fix PyQt6 stubs
        run: pixi run python scripts/fix_pyqt6_stubs.py
      - name: Build and install native hexcore module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pixi run maturin build --release --manifest-path src/intellicrack-hexcore/Cargo.toml --out target/wheels
          if ($LASTEXITCODE -ne 0) { throw 'maturin build failed' }
          $wheel = Get-ChildItem target/wheels/intellicrack_hexcore-*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'intellicrack_hexcore wheel not produced' }
          pixi run pip install --no-deps --force-reinstall $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'intellicrack_hexcore wheel install failed' }
          pixi run python -c "import intellicrack_hexcore"
          if ($LASTEXITCODE -ne 0) { throw 'intellicrack_hexcore import verification failed' }
        timeout-minutes: 20
      - name: Type check with basedpyright
        run: |
          pixi run basedpyright src/
  python-mock-verify:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Verify No Mock Usage (Production-Ready Enforcement)
        run: |
          pixi run python scripts/verify_no_mocks.py --ci
  python-test:
    runs-on: windows-latest
    needs: [setup, changes]
    if: (success() || failure()) && (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Install package in editable mode
        run: pixi run pip install -e .
      - name: Build and install native hexcore module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pixi run maturin build --release --manifest-path src/intellicrack-hexcore/Cargo.toml --out target/wheels
          if ($LASTEXITCODE -ne 0) { throw 'maturin build failed' }
          $wheel = Get-ChildItem target/wheels/intellicrack_hexcore-*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'intellicrack_hexcore wheel not produced' }
          pixi run pip install --no-deps --force-reinstall $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'intellicrack_hexcore wheel install failed' }
          pixi run python -c "import intellicrack_hexcore"
          if ($LASTEXITCODE -ne 0) { throw 'intellicrack_hexcore import verification failed' }
        timeout-minutes: 20
      - name: Build x64dbg bridge plugins for deployment tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S src/x64dbg-plugin -B src/x64dbg-plugin/build_x64 -A x64 -DBUILD_X64=ON
          if ($LASTEXITCODE -ne 0) { throw 'x64 CMake configure failed' }
          cmake --build src/x64dbg-plugin/build_x64 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x64 plugin build failed' }
          cmake -S src/x64dbg-plugin -B src/x64dbg-plugin/build_x86 -A Win32 -DBUILD_X64=OFF
          if ($LASTEXITCODE -ne 0) { throw 'x32 CMake configure failed' }
          cmake --build src/x64dbg-plugin/build_x86 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x32 plugin build failed' }
          $x64 = 'src/x64dbg-plugin/bin/intellicrack_bridge_x64.dp64'
          $x32 = 'src/x64dbg-plugin/bin/intellicrack_bridge_x32.dp32'
          foreach ($p in @($x64, $x32)) {
            if (-not (Test-Path $p)) { throw "expected plugin binary missing: $p" }
            if ((Get-Item $p).Length -eq 0) { throw "plugin binary is empty: $p" }
            Write-Host "built $p ($((Get-Item $p).Length) bytes)"
          }
        timeout-minutes: 20
      - name: Fix PyQt6 ICU DLL resolution
        run: pixi run fix-pyqt6-icu
      - name: Test with pytest
        run: |
          pixi run pytest tests/ -v --cov=src/intellicrack --cov-report=xml --cov-report=html --junitxml=test-results.xml
        env:
          PYTHONDONTWRITEBYTECODE: 1
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            test-results.xml
            htmlcov/
            coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-windows-py3.12
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Warn when coverage.xml is missing
        if: always() && hashFiles('coverage.xml') == ''
        run: |
          Write-Host '::warning::coverage.xml was not produced (the pytest step likely crashed before pytest-cov could write its report). Skipping the SonarQube Scan step for this run so SonarCloud does not record a false 0% coverage analysis and fail the quality gate on a run that never had coverage data to begin with.'
      - name: SonarQube Scan
        if: always() && hashFiles('coverage.xml') != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
  x64dbg-plugin-build:
    runs-on: windows-latest
    needs: [setup, changes]
    if: (success() || failure()) && (needs.changes.outputs.x64dbg == 'true' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build x64 bridge plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S src/x64dbg-plugin -B src/x64dbg-plugin/build_x64 -A x64 -DBUILD_X64=ON
          if ($LASTEXITCODE -ne 0) { throw 'x64 CMake configure failed' }
          cmake --build src/x64dbg-plugin/build_x64 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x64 plugin build failed' }
          cmake --install src/x64dbg-plugin/build_x64 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x64 plugin install failed' }
        timeout-minutes: 15
      - name: Build x32 bridge plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S src/x64dbg-plugin -B src/x64dbg-plugin/build_x86 -A Win32 -DBUILD_X64=OFF
          if ($LASTEXITCODE -ne 0) { throw 'x32 CMake configure failed' }
          cmake --build src/x64dbg-plugin/build_x86 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x32 plugin build failed' }
          cmake --install src/x64dbg-plugin/build_x86 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x32 plugin install failed' }
        timeout-minutes: 15
      - name: Verify plugin artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $x64 = 'tools/x64dbg/release/x64/plugins/intellicrack_bridge_x64.dp64'
          $x32 = 'tools/x64dbg/release/x32/plugins/intellicrack_bridge_x32.dp32'
          foreach ($p in @($x64, $x32)) {
            if (-not (Test-Path $p)) { throw "expected plugin artifact missing: $p" }
            if ((Get-Item $p).Length -eq 0) { throw "plugin artifact is empty: $p" }
            Write-Host "built $p ($((Get-Item $p).Length) bytes)"
          }
      - name: Upload plugin artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x64dbg-bridge-plugins
          path: |
            tools/x64dbg/release/x64/plugins/intellicrack_bridge_x64.dp64
            tools/x64dbg/release/x32/plugins/intellicrack_bridge_x32.dp32
