name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: latest
      - name: Install dependencies
        run: |
          pixi install
        timeout-minutes: 15
      - name: Generate requirements.txt for Dependabot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item requirements.txt -ErrorAction SilentlyContinue
          pixi run python scripts/generate_requirements.py
          if ($LASTEXITCODE -ne 0) { throw 'generate_requirements.py failed' }
          git diff --exit-code -- requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::requirements.txt is out of sync with pixi.lock/pyproject.toml. Run scripts/generate_requirements.py (or let the pre-commit hook do it) and commit the result -- do not edit requirements.txt by hand.'
            exit 1
          }
        timeout-minutes: 5
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.python_diff.outputs.substantive || 'false' }}
      x64dbg: ${{ steps.x64dbg_diff.outputs.substantive || 'false' }}
      test_shards: ${{ steps.shards.outputs.matrix }}
      test_shard_names: ${{ steps.shards.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Define test shards
        id: shards
        shell: python
        run: |
          import json
          import os

          groups = {
              "sandbox": ["tests/sandbox"],
              "bridges": ["tests/bridges"],
              "ui": ["tests/ui"],
              "mcp-hexpat": ["tests/mcp", "tests/hexpat"],
          }
          assigned = [path for paths in groups.values() for path in paths]
          shards = [{"name": name, "targets": " ".join(paths)} for name, paths in groups.items()]
          shards.append({"name": "rest", "targets": " ".join(["tests/", *(f"--ignore={path}" for path in assigned)])})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps({'include': shards})}\n")
              output.write(f"names={json.dumps([shard['name'] for shard in shards])}\n")
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: shell
          filters: |
            python:
              - 'src/intellicrack/**'
              - 'src/intellicrack-hexcore/**'
              - 'src/x64dbg-plugin/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'pixi.lock'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'
            x64dbg:
              - 'src/x64dbg-plugin/**'
              - '.github/workflows/ci.yml'
      - name: Classify python-relevant changes as substantive or comment-only
        if: steps.filter.outputs.python == 'true'
        id: python_diff
        uses: ./.github/actions/comment-only-diff
        with:
          paths: ${{ steps.filter.outputs.python_files }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - name: Classify x64dbg-relevant changes as substantive or comment-only
        if: steps.filter.outputs.x64dbg == 'true'
        id: x64dbg_diff
        uses: ./.github/actions/comment-only-diff
        with:
          paths: ${{ steps.filter.outputs.x64dbg_files }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  python-lint:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Lint with ruff
        run: |
          pixi run ruff check src/ tests/ --output-format=github
          pixi run ruff format --check --diff src/ tests/
  python-security:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Security scan with bandit
        run: pixi run bandit -r src/intellicrack/ -f json -o bandit-report.json || true
      - name: Print security results
        if: always()
        shell: python
        run: |
          import json
          import pathlib
          report = pathlib.Path("bandit-report.json")
          if report.exists():
              data = json.loads(report.read_text())
              results = data.get("results", [])
              print(f"Security Issues: {len(results)}")
              for r in results:
                  sev = r.get("issue_severity", "?")
                  conf = r.get("issue_confidence", "?")
                  text = r.get("issue_text", "")
                  fname = r.get("filename", "")
                  line = r.get("line_number", 0)
                  print(f"  [{sev}/{conf}] {fname}:{line} - {text}")
          else:
              print("No bandit report found")
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-report
          path: bandit-report.json
  python-typecheck:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Install package in editable mode
        run: pixi run pip install -e .
      - name: Fix PyQt6 stubs
        run: pixi run python scripts/fix_pyqt6_stubs.py
      - name: Build and install native hexcore module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pixi run maturin build --release --manifest-path src/intellicrack-hexcore/Cargo.toml --out target/wheels
          if ($LASTEXITCODE -ne 0) { throw 'maturin build failed' }
          $wheel = Get-ChildItem target/wheels/intellicrack_hexcore-*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'intellicrack_hexcore wheel not produced' }
          pixi run pip install --no-deps --force-reinstall $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'intellicrack_hexcore wheel install failed' }
          pixi run python -c "import intellicrack_hexcore"
          if ($LASTEXITCODE -ne 0) { throw 'intellicrack_hexcore import verification failed' }
        timeout-minutes: 20
      - name: Type check with basedpyright
        run: |
          pixi run basedpyright src/
  python-mock-verify:
    runs-on: windows-latest
    needs: [setup]
    if: success() || failure()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Verify No Mock Usage (Production-Ready Enforcement)
        run: |
          pixi run python scripts/verify_no_mocks.py --ci
  python-test-shard:
    name: python-test (${{ matrix.name }})
    runs-on: windows-latest
    needs: [setup, changes]
    if: (success() || failure()) && (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Install package in editable mode
        run: pixi run pip install -e .
      - name: Build and install native hexcore module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pixi run maturin build --release --manifest-path src/intellicrack-hexcore/Cargo.toml --out target/wheels
          if ($LASTEXITCODE -ne 0) { throw 'maturin build failed' }
          $wheel = Get-ChildItem target/wheels/intellicrack_hexcore-*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'intellicrack_hexcore wheel not produced' }
          pixi run pip install --no-deps --force-reinstall $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'intellicrack_hexcore wheel install failed' }
          pixi run python -c "import intellicrack_hexcore"
          if ($LASTEXITCODE -ne 0) { throw 'intellicrack_hexcore import verification failed' }
        timeout-minutes: 20
      - name: Build x64dbg bridge plugins for deployment tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S src/x64dbg-plugin -B src/x64dbg-plugin/build_x64 -A x64 -DBUILD_X64=ON
          if ($LASTEXITCODE -ne 0) { throw 'x64 CMake configure failed' }
          cmake --build src/x64dbg-plugin/build_x64 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x64 plugin build failed' }
          cmake -S src/x64dbg-plugin -B src/x64dbg-plugin/build_x86 -A Win32 -DBUILD_X64=OFF
          if ($LASTEXITCODE -ne 0) { throw 'x32 CMake configure failed' }
          cmake --build src/x64dbg-plugin/build_x86 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x32 plugin build failed' }
          $x64 = 'src/x64dbg-plugin/bin/intellicrack_bridge_x64.dp64'
          $x32 = 'src/x64dbg-plugin/bin/intellicrack_bridge_x32.dp32'
          foreach ($p in @($x64, $x32)) {
            if (-not (Test-Path $p)) { throw "expected plugin binary missing: $p" }
            if ((Get-Item $p).Length -eq 0) { throw "plugin binary is empty: $p" }
            Write-Host "built $p ($((Get-Item $p).Length) bytes)"
          }
        timeout-minutes: 20
      - name: Fix PyQt6 ICU DLL resolution
        run: pixi run fix-pyqt6-icu
      - name: Test with pytest
        shell: pwsh
        run: |
          $sampler = Start-ThreadJob -StreamingHost $Host -ScriptBlock {
            while ($true) {
              $drives = Get-PSDrive -PSProvider FileSystem |
                Where-Object { $_.Name.Length -eq 1 -and $null -ne $_.Free } |
                ForEach-Object { '{0}: {1:N1} GB' -f $_.Name, ($_.Free / 1GB) }
              $procs = Get-Process python -ErrorAction SilentlyContinue |
                Sort-Object PrivateMemorySize64 -Descending | Select-Object -First 3 |
                ForEach-Object { '{0}={1:N1}' -f $_.Id, ($_.PrivateMemorySize64 / 1GB) }
              $page = Get-CimInstance Win32_PageFileUsage |
                ForEach-Object { '{0:N1}/{1:N1}' -f ($_.CurrentUsage / 1024), ($_.AllocatedBaseSize / 1024) }
              Write-Host ('[disk-free] {0:HH:mm:ss}  {1}' -f (Get-Date), ($drives -join '  '))
              Write-Host ('[memory] {0:HH:mm:ss}  python private GB: {1}  pagefile used/size GB: {2}' -f (Get-Date), ($procs -join ' '), ($page -join ' '))
              Start-Sleep -Seconds 120
            }
          }
          $targets = $env:SHARD_TARGETS -split ' '
          pixi run pytest @targets -v -n logical --dist loadfile --instafail -m "not host_native" --cov=src/intellicrack --cov-report= --cov-fail-under=0 "--junitxml=test-results-${env:SHARD}.xml"
          $code = $LASTEXITCODE
          Stop-Job $sampler
          if (Test-Path .coverage) { Rename-Item .coverage ".coverage.${env:SHARD}" }
          Set-Content -Path "pytest-exit-${env:SHARD}.txt" -Value $code
          exit $code
        env:
          SHARD: ${{ matrix.name }}
          SHARD_TARGETS: ${{ matrix.targets }}
          PYTHONDONTWRITEBYTECODE: 1
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-shard-${{ matrix.name }}
          include-hidden-files: true
          path: |
            test-results-${{ matrix.name }}.xml
            .coverage.${{ matrix.name }}
            pytest-exit-${{ matrix.name }}.txt
  python-test:
    runs-on: windows-latest
    needs: [changes, python-test-shard]
    if: (success() || failure()) && (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: Download shard results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-*
          merge-multiple: true
      - name: Check shard results and merge test reports
        id: shards
        if: always()
        shell: python
        env:
          SHARD_NAMES: ${{ needs.changes.outputs.test_shard_names }}
        run: |
          import json
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          problems = []
          coverage_complete = True
          merged = ET.Element("testsuites")
          for shard in json.loads(os.environ["SHARD_NAMES"]):
              exit_file = pathlib.Path(f"pytest-exit-{shard}.txt")
              if not exit_file.exists():
                  problems.append(f"{shard}: no result was uploaded (the shard job ended before pytest finished)")
              elif (code := exit_file.read_text(encoding="utf-8").strip()) != "0":
                  problems.append(f"{shard}: pytest exited with code {code}")
              if not pathlib.Path(f".coverage.{shard}").exists():
                  coverage_complete = False
                  problems.append(f"{shard}: no coverage data was uploaded")
              report = pathlib.Path(f"test-results-{shard}.xml")
              if report.exists():
                  merged.extend(ET.parse(report).getroot().iter("testsuite"))
          ET.ElementTree(merged).write("test-results.xml", encoding="utf-8", xml_declaration=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"coverage_complete={'true' if coverage_complete else 'false'}\n")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
      - name: Combine coverage and enforce the threshold
        if: always() && steps.shards.outputs.coverage_complete == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pixi run coverage combine
          if ($LASTEXITCODE -ne 0) { throw 'coverage combine failed' }
          pixi run coverage xml --fail-under=0
          if ($LASTEXITCODE -ne 0) { throw 'coverage xml failed' }
          Write-Host 'Total coverage (percent):'
          pixi run coverage report --format=total
          exit $LASTEXITCODE
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-windows-py3.12
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Warn when coverage.xml is missing
        if: always() && hashFiles('coverage.xml') == ''
        run: |
          Write-Host '::warning::coverage.xml was not produced (a test shard ended without uploading its coverage data, or combining the shards failed). Skipping the SonarQube Scan step for this run so SonarCloud does not record a false 0% coverage analysis and fail the quality gate on a run that never had coverage data to begin with.'
      - name: SonarQube Scan
        if: always() && hashFiles('coverage.xml') != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
  x64dbg-plugin-build:
    runs-on: windows-latest
    needs: [setup, changes]
    if: (success() || failure()) && (needs.changes.outputs.x64dbg == 'true' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build x64 bridge plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S src/x64dbg-plugin -B src/x64dbg-plugin/build_x64 -A x64 -DBUILD_X64=ON
          if ($LASTEXITCODE -ne 0) { throw 'x64 CMake configure failed' }
          cmake --build src/x64dbg-plugin/build_x64 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x64 plugin build failed' }
          cmake --install src/x64dbg-plugin/build_x64 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x64 plugin install failed' }
        timeout-minutes: 15
      - name: Build x32 bridge plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S src/x64dbg-plugin -B src/x64dbg-plugin/build_x86 -A Win32 -DBUILD_X64=OFF
          if ($LASTEXITCODE -ne 0) { throw 'x32 CMake configure failed' }
          cmake --build src/x64dbg-plugin/build_x86 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x32 plugin build failed' }
          cmake --install src/x64dbg-plugin/build_x86 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'x32 plugin install failed' }
        timeout-minutes: 15
      - name: Verify plugin artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $x64 = 'tools/x64dbg/release/x64/plugins/intellicrack_bridge_x64.dp64'
          $x32 = 'tools/x64dbg/release/x32/plugins/intellicrack_bridge_x32.dp32'
          foreach ($p in @($x64, $x32)) {
            if (-not (Test-Path $p)) { throw "expected plugin artifact missing: $p" }
            if ((Get-Item $p).Length -eq 0) { throw "plugin artifact is empty: $p" }
            Write-Host "built $p ($((Get-Item $p).Length) bytes)"
          }
      - name: Upload plugin artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x64dbg-bridge-plugins
          path: |
            tools/x64dbg/release/x64/plugins/intellicrack_bridge_x64.dp64
            tools/x64dbg/release/x32/plugins/intellicrack_bridge_x32.dp32
