name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'
concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch'
    outputs:
      python: ${{ steps.python_diff.outputs.substantive || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: shell
          filters: |
            python:
              - 'src/intellicrack/**'
              - 'src/intellicrack-hexcore/**'
              - 'src/x64dbg-plugin/**'
              - 'src/hexbench/**'
              - 'scripts/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'pixi.lock'
              - '.github/workflows/qodana_code_quality.yml'
      - name: Classify python changes
        if: steps.filter.outputs.python == 'true'
        id: python_diff
        uses: ./.github/actions/comment-only-diff
        with:
          paths: ${{ steps.filter.outputs.python_files }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  qodana:
    runs-on: windows-latest
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true'
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: false
          upload-result: true
          artifact-name: qodana-report
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2146858828 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          QODANA_PYTHON_PATH: ${{ github.workspace }}\.pixi\envs\default\python.exe
      - name: Print Qodana findings summary
        if: always()
        shell: python
        run: |
          import json
          import os
          import pathlib
          sarif_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "qodana" / "results" / "qodana.sarif.json"
          if not sarif_path.exists():
              print("No SARIF report found")
              raise SystemExit(0)
          data = json.loads(sarif_path.read_text(encoding="utf-8"))
          total = 0
          by_rule = {}
          for run in data.get("runs", []):
              for result in run.get("results", []):
                  total += 1
                  rule = result.get("ruleId", "unknown")
                  by_rule[rule] = by_rule.get(rule, 0) + 1
          print(f"Qodana Total Findings: {total}")
          print("-" * 60)
          for rule, count in sorted(by_rule.items(), key=lambda x: -x[1]):
              print(f"  {count:5d}  {rule}")
