name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'
jobs:
  qodana:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: latest
      - name: Install dependencies
        run: pixi install
        timeout-minutes: 15
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2.1
        with:
          pr-mode: false
          upload-result: true
          artifact-name: qodana-report
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2146858828 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          QODANA_PYTHON_PATH: ${{ github.workspace }}\.pixi\envs\default\python.exe
      - name: Print Qodana findings summary
        if: always()
        shell: python
        run: |
          import json
          import os
          import pathlib
          sarif_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "qodana" / "results" / "qodana.sarif.json"
          if not sarif_path.exists():
              print("No SARIF report found")
              raise SystemExit(0)
          data = json.loads(sarif_path.read_text(encoding="utf-8"))
          total = 0
          by_rule = {}
          for run in data.get("runs", []):
              for result in run.get("results", []):
                  total += 1
                  rule = result.get("ruleId", "unknown")
                  by_rule[rule] = by_rule.get(rule, 0) + 1
          print(f"Qodana Total Findings: {total}")
          print("-" * 60)
          for rule, count in sorted(by_rule.items(), key=lambda x: -x[1]):
              print(f"  {count:5d}  {rule}")
