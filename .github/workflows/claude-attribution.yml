name: Claude Attribution
on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: claude-attribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  no-claude-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: python scripts/check_claude_attribution.py range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan pull request body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python scripts/check_claude_attribution.py text "$RUNNER_TEMP/pr-body.md"
      - name: Scan pushed commits
        if: github.event_name == 'push' && github.event.deleted == false
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python scripts/check_claude_attribution.py range "$AFTER" --not "origin/$DEFAULT_BRANCH"
          else
            python scripts/check_claude_attribution.py range "$BEFORE..$AFTER"
          fi
