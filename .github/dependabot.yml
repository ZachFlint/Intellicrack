version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: 'cargo'
    directory: '/src/intellicrack-hexcore'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'rust'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
    groups:
      cargo:
        patterns: ['*']
  # NOTE: requirements.txt is generated from pixi.lock by scripts/generate_requirements.py
  # (regenerated by the pre-commit hook and re-checked by ci.yml's setup job). PRs from
  # this block are advisory only -- do not merge them directly, since the next regen
  # overwrites any hand edit. Bump the real floor in pyproject.toml's
  # [tool.pixi.pypi-dependencies] (or the relevant pixi dependency) instead, and let
  # pixi.lock/requirements.txt regenerate. dependabot-auto-merge.yml excludes this
  # ecosystem from auto-merge for the same reason.
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
    groups:
      pip:
        patterns: ['*']
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
    groups:
      docker:
        patterns: ['*']
