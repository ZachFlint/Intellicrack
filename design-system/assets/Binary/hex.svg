<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#795548;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
    <filter id="hexShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#1C0E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Hex editor window background -->
  <rect x="2" y="2" width="20" height="20" rx="2"
        fill="url(#hexGradient)" stroke="#1C0E0B" stroke-width="0.8" filter="url(#hexShadowFilter)"/>

  <!-- Hex editor grid -->
  <rect x="3" y="3" width="18" height="18" rx="1" fill="#2C2C2C"/>

  <!-- Address column -->
  <rect x="3" y="3" width="4" height="18" fill="#424242"/>
  <text x="5" y="6" font-family="monospace" font-size="2" text-anchor="middle" fill="#FFEB3B">0000</text>
  <text x="5" y="9" font-family="monospace" font-size="2" text-anchor="middle" fill="#FFEB3B">0010</text>
  <text x="5" y="12" font-family="monospace" font-size="2" text-anchor="middle" fill="#FFEB3B">0020</text>
  <text x="5" y="15" font-family="monospace" font-size="2" text-anchor="middle" fill="#FFEB3B">0030</text>
  <text x="5" y="18" font-family="monospace" font-size="2" text-anchor="middle" fill="#FFEB3B">0040</text>

  <!-- Hex data columns -->
  <text x="8" y="6" font-family="monospace" font-size="1.8" fill="#4CAF50">4D 5A 90 00</text>
  <text x="8" y="9" font-family="monospace" font-size="1.8" fill="#2196F3">03 00 00 00</text>
  <text x="8" y="12" font-family="monospace" font-size="1.8" fill="#FF9800">04 00 00 00</text>
  <text x="8" y="15" font-family="monospace" font-size="1.8" fill="#F44336">FF FF 00 00</text>
  <text x="8" y="18" font-family="monospace" font-size="1.8" fill="#9C27B0">B8 00 00 00</text>

  <!-- ASCII representation column -->
  <rect x="17" y="3" width="4" height="18" fill="#37474F"/>
  <text x="19" y="6" font-family="monospace" font-size="1.8" text-anchor="middle" fill="#FFFFFF">MZ..</text>
  <text x="19" y="9" font-family="monospace" font-size="1.8" text-anchor="middle" fill="#FFFFFF">...</text>
  <text x="19" y="12" font-family="monospace" font-size="1.8" text-anchor="middle" fill="#FFFFFF">...</text>
  <text x="19" y="15" font-family="monospace" font-size="1.8" text-anchor="middle" fill="#FFFFFF">ÿÿ..</text>
  <text x="19" y="18" font-family="monospace" font-size="1.8" text-anchor="middle" fill="#FFFFFF">¸...</text>

  <!-- Current selection highlight -->
  <rect x="8" y="7" width="8" height="2" fill="#FFD54F" opacity="0.3"/>
  <rect x="7.5" y="7" width="0.5" height="2" fill="#FF8F00"/>

  <!-- Hex editor cursor -->
  <rect x="14" y="11" width="1" height="2" fill="#00FF00" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- File size indicator -->
  <rect x="14" y="19.5" width="6" height="1.5" fill="#546E7A"/>
  <text x="17" y="20.5" font-family="monospace" font-size="1.5" text-anchor="middle" fill="#FFFFFF">1024KB</text>

  <!-- Highlight gloss effect -->
  <ellipse cx="10" cy="5" rx="4" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
