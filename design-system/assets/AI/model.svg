<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="modelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1" />
    </linearGradient>
    <filter id="modelShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#BF360C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- AI Model container -->
  <rect x="3" y="3" width="18" height="18" rx="3"
        fill="url(#modelGradient)" stroke="#BF360C" stroke-width="0.8" filter="url(#modelShadowFilter)"/>

  <!-- Model layers representation -->
  <rect x="5" y="5" width="14" height="2" rx="1" fill="#FFE0B2" opacity="0.8"/>
  <rect x="5" y="8" width="14" height="2" rx="1" fill="#FFCC02" opacity="0.8"/>
  <rect x="5" y="11" width="14" height="2" rx="1" fill="#FFB300" opacity="0.8"/>
  <rect x="5" y="14" width="14" height="2" rx="1" fill="#FF8F00" opacity="0.8"/>
  <rect x="5" y="17" width="14" height="2" rx="1" fill="#FF6F00" opacity="0.8"/>

  <!-- Model parameters/weights -->
  <circle cx="7" cy="6" r="0.5" fill="#4A148C"/>
  <circle cx="10" cy="6" r="0.5" fill="#6A1B9A"/>
  <circle cx="13" cy="6" r="0.5" fill="#7B1FA2"/>
  <circle cx="16" cy="6" r="0.5" fill="#8E24AA"/>

  <!-- Neural connections -->
  <path d="M6 9 L8 11" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <path d="M11 9 L13 11" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <path d="M16 9 L18 11" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

  <!-- Processing indicator -->
  <rect x="10" y="20" width="4" height="1" rx="0.5" fill="#4CAF50">
    <animate attributeName="width" values="0;14;0" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
