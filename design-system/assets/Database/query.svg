<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="dbQueryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <filter id="dbQueryShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#01579B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Query window/console -->
  <rect x="2" y="2" width="20" height="20" rx="2"
        fill="url(#dbQueryGradient)" stroke="#01579B" stroke-width="0.8" filter="url(#dbQueryShadowFilter)"/>

  <!-- Console background -->
  <rect x="3" y="3" width="18" height="18" rx="1" fill="#263238"/>

  <!-- SQL query text -->
  <text x="4" y="7" font-family="monospace" font-size="2.5" fill="#FFD54F">SELECT</text>
  <text x="12" y="7" font-family="monospace" font-size="2.5" fill="#FFFFFF">* FROM</text>

  <text x="4" y="10" font-family="monospace" font-size="2.5" fill="#4CAF50">users</text>
  <text x="10" y="10" font-family="monospace" font-size="2.5" fill="#FFD54F">WHERE</text>

  <text x="4" y="13" font-family="monospace" font-size="2.5" fill="#FFFFFF">id =</text>
  <text x="8" y="13" font-family="monospace" font-size="2.5" fill="#FF9800">123</text>
  <text x="13" y="13" font-family="monospace" font-size="2.5" fill="#FFD54F">;</text>

  <!-- Query cursor -->
  <rect x="14" y="11.5" width="0.5" height="2.5" fill="#00FF00">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Result set preview -->
  <rect x="4" y="15" width="16" height="5" rx="0.5" fill="#37474F" stroke="#546E7A" stroke-width="0.3"/>

  <!-- Table headers -->
  <rect x="4.5" y="15.5" width="15" height="1" fill="#5C6BC0"/>
  <text x="6" y="16.2" font-family="monospace" font-size="1.5" fill="#FFFFFF">ID</text>
  <text x="10" y="16.2" font-family="monospace" font-size="1.5" fill="#FFFFFF">NAME</text>
  <text x="16" y="16.2" font-family="monospace" font-size="1.5" fill="#FFFFFF">EMAIL</text>

  <!-- Sample data rows -->
  <text x="6" y="17.8" font-family="monospace" font-size="1.5" fill="#4CAF50">123</text>
  <text x="10" y="17.8" font-family="monospace" font-size="1.5" fill="#FFFFFF">John</text>
  <text x="15" y="17.8" font-family="monospace" font-size="1.5" fill="#FFFFFF">j@ex.com</text>

  <text x="6" y="19.2" font-family="monospace" font-size="1.5" fill="#4CAF50">124</text>
  <text x="10" y="19.2" font-family="monospace" font-size="1.5" fill="#FFFFFF">Jane</text>
  <text x="15" y="19.2" font-family="monospace" font-size="1.5" fill="#FFFFFF">ja@ex.com</text>

  <!-- Query execution indicator -->
  <circle cx="18" cy="5" r="1.5" fill="#4CAF50">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="18" y="5.5" font-family="monospace" font-size="1.5" text-anchor="middle" fill="#FFFFFF">✓</text>

  <!-- Highlight gloss effect -->
  <ellipse cx="8" cy="5" rx="4" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
