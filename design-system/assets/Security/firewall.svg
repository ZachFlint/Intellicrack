<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="firewallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D84315;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD54F;stop-opacity:1" />
    </linearGradient>
    <filter id="firewallShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#BF360C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Firewall base (brick wall) -->
  <rect x="2" y="14" width="20" height="8" rx="1" fill="url(#firewallGradient)" stroke="#BF360C" stroke-width="0.8" filter="url(#firewallShadowFilter)"/>

  <!-- Brick pattern -->
  <rect x="2" y="14" width="10" height="2" fill="#D84315"/>
  <rect x="2" y="16" width="8" height="2" fill="#F4511E"/>
  <rect x="10" y="16" width="8" height="2" fill="#F4511E"/>
  <rect x="18" y="16" width="4" height="2" fill="#F4511E"/>
  <rect x="2" y="18" width="10" height="2" fill="#D84315"/>
  <rect x="12" y="14" width="10" height="2" fill="#D84315"/>
  <rect x="2" y="20" width="8" height="2" fill="#FF6F00"/>
  <rect x="10" y="18" width="8" height="2" fill="#FF6F00"/>
  <rect x="18" y="18" width="4" height="2" fill="#FF6F00"/>
  <rect x="12" y="20" width="10" height="2" fill="#FF6F00"/>

  <!-- Firewall flames -->
  <path d="M4 14 Q4 10 6 8 Q5 6 7 4 Q8 6 10 4 Q9 8 12 6 Q11 10 14 8 Q13 6 15 4 Q16 6 18 4 Q17 8 20 6 Q19 10 20 14"
        fill="url(#flameGradient)" opacity="0.9"/>

  <!-- Inner flame details -->
  <path d="M6 12 Q7 8 9 10 Q10 6 12 8 Q13 4 15 6 Q16 8 18 6 Q17 10 18 12"
        fill="#FFD54F" opacity="0.7"/>

  <!-- Security barrier lines -->
  <path d="M1 13 L23 13" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <path d="M1 11 L23 11" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <path d="M1 9 L23 9" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>

  <!-- Network traffic indicators (blocked/allowed) -->
  <circle cx="3" cy="5" r="1" fill="#F44336"/>
  <path d="M2.2 4.2 L3.8 5.8 M3.8 4.2 L2.2 5.8" stroke="#FFFFFF" stroke-width="0.5"/>

  <circle cx="21" cy="5" r="1" fill="#4CAF50"/>
  <path d="M20.2 5 L21.8 5 M21 4.2 L21 5.8" stroke="#FFFFFF" stroke-width="0.5"/>

  <!-- Highlight gloss effect -->
  <ellipse cx="10" cy="8" rx="4" ry="2" fill="#FFFFFF" opacity="0.2"/>
</svg>
