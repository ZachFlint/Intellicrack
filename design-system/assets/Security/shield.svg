<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <filter id="shieldShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#01579B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Shield background -->
  <path d="M12 2 L4 6 L4 12 Q4 18 12 22 Q20 18 20 12 L20 6 Z"
        fill="url(#shieldGradient)" stroke="#01579B" stroke-width="0.8" filter="url(#shieldShadowFilter)"/>

  <!-- Shield inner border -->
  <path d="M12 3.5 L5.5 7 L5.5 12 Q5.5 17 12 20.5 Q18.5 17 18.5 12 L18.5 7 Z"
        fill="none" stroke="#BBDEFB" stroke-width="0.5" opacity="0.6"/>

  <!-- Shield emblem (checkmark for protection) -->
  <path d="M8 12 L11 15 L16 10" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Additional security elements -->
  <circle cx="12" cy="12" r="6" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>

  <!-- Lock symbol at top -->
  <rect x="11" y="5.5" width="2" height="2" rx="0.3" fill="#FFD700" stroke="#FF8F00" stroke-width="0.3"/>
  <path d="M10.5 6.5 Q10.5 5.5 12 5.5 Q13.5 5.5 13.5 6.5" stroke="#FFD700" stroke-width="0.8" fill="none"/>

  <!-- Highlight gloss effect -->
  <ellipse cx="10" cy="7" rx="3" ry="2" fill="#FFFFFF" opacity="0.2"/>
</svg>
