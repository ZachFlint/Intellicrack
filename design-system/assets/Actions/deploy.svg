<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="deployGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cloud infrastructure -->
  <ellipse cx="12" cy="6" rx="6" ry="2.5" fill="url(#cloudGradient)" stroke="#1976D2" stroke-width="0.5"/>
  <path d="M6 6 Q6 8.5 12 8.5 Q18 8.5 18 6" fill="url(#cloudGradient)" stroke="#1976D2" stroke-width="0.5"/>

  <!-- Server/deployment target -->
  <rect x="8" y="14" width="8" height="6" rx="1" fill="#455A64" stroke="#263238" stroke-width="0.5"/>
  <rect x="9" y="15" width="6" height="1" fill="#4CAF50"/>
  <rect x="9" y="17" width="6" height="1" fill="#FF9800"/>
  <rect x="9" y="19" width="6" height="1" fill="#2196F3"/>

  <!-- Upload arrow -->
  <path d="M12 10 L12 14" stroke="url(#deployGradient)" stroke-width="2" fill="none"/>
  <path d="M10 11 L12 9 L14 11" stroke="url(#deployGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connection dots -->
  <circle cx="8" cy="11" r="1" fill="#4CAF50"/>
  <circle cx="12" cy="11" r="1" fill="#FF9800"/>
  <circle cx="16" cy="11" r="1" fill="#F44336"/>
</svg>
