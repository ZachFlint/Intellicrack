<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="gdbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3F51B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A237E;stop-opacity:1" />
    </linearGradient>
    <filter id="gdbShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#0D1B5E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- GDB background shape -->
  <circle cx="12" cy="12" r="11" fill="url(#gdbGradient)" stroke="#0D1B5E" stroke-width="0.8" filter="url(#gdbShadowFilter)"/>
  <circle cx="12" cy="12" r="8.5" fill="none" stroke="#C5CAE9" stroke-width="0.5" opacity="0.6"/>

  <!-- GDB bug/beetle icon (GNU Debugger reference) -->
  <ellipse cx="12" cy="12" rx="5" ry="3.5" fill="#212121" stroke="#000000" stroke-width="0.5"/>
  <ellipse cx="12" cy="11" rx="3.5" ry="2.5" fill="#424242"/>

  <!-- Bug antennae -->
  <path d="M10 8 Q9 6 8 7" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M14 8 Q15 6 16 7" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Bug legs -->
  <path d="M7 11 L5 10" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  <path d="M7 13 L5 14" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  <path d="M17 11 L19 10" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  <path d="M17 13 L19 14" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>

  <!-- Bug spots/debug markers -->
  <circle cx="11" cy="10.5" r="0.8" fill="#F44336"/>
  <circle cx="13" cy="10.5" r="0.8" fill="#F44336"/>
  <circle cx="12" cy="12.5" r="1" fill="#FF9800"/>

  <!-- Highlight gloss effect -->
  <ellipse cx="10" cy="7" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
