<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="fridaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AD1457;stop-opacity:1" />
    </linearGradient>
    <filter id="fridaShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#880E4F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Frida background shape -->
  <rect x="2" y="2" width="20" height="20" rx="3" fill="url(#fridaGradient)" stroke="#880E4F" stroke-width="0.8" filter="url(#fridaShadowFilter)"/>

  <!-- Frida "F" stylized -->
  <path d="M6 6 L6 18 M6 6 L16 6 M6 12 L14 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic instrumentation symbol (syringe/injection) -->
  <circle cx="17" cy="7" r="2" fill="#FFEB3B" stroke="#FF8F00" stroke-width="0.5"/>
  <rect x="16.2" y="8.5" width="1.6" height="4" fill="#FF8F00"/>
  <path d="M15.5 12.5 L18.5 12.5" stroke="#FF8F00" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Binary code pattern -->
  <text x="18" y="17" font-family="monospace" font-size="3" fill="#FFFFFF" opacity="0.7">101</text>
  <text x="18" y="20" font-family="monospace" font-size="3" fill="#FFFFFF" opacity="0.5">010</text>

  <!-- Highlight gloss effect -->
  <ellipse cx="8" cy="6" rx="4" ry="2" fill="#FFFFFF" opacity="0.2"/>
</svg>
