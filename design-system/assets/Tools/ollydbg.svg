<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="ollydbgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#607D8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#263238;stop-opacity:1" />
    </linearGradient>
    <filter id="ollydbgShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#102027" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- OllyDbg background shape (classic Windows debugger) -->
  <rect x="2" y="2" width="20" height="20" rx="2" fill="url(#ollydbgGradient)" stroke="#102027" stroke-width="0.8" filter="url(#ollydbgShadowFilter)"/>
  <rect x="3" y="3" width="18" height="16" rx="1" fill="#37474F"/>
  <rect x="3" y="19" width="18" height="2" rx="1" fill="#546E7A"/>

  <!-- OllyDbg "O" stylized -->
  <circle cx="12" cy="11" r="5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="12" cy="11" r="2" fill="#FFFFFF"/>

  <!-- Debug/analysis windows -->
  <rect x="4" y="4" width="7" height="3" fill="#4CAF50" opacity="0.7"/>
  <rect x="12" y="4" width="7" height="3" fill="#FF9800" opacity="0.7"/>
  <rect x="4" y="8" width="7" height="3" fill="#2196F3" opacity="0.7"/>
  <rect x="12" y="8" width="7" height="3" fill="#F44336" opacity="0.7"/>

  <!-- Assembly code representation -->
  <text x="5" y="6.5" font-family="monospace" font-size="2.5" fill="#000000">MOV</text>
  <text x="13" y="6.5" font-family="monospace" font-size="2.5" fill="#000000">JMP</text>
  <text x="5" y="10.5" font-family="monospace" font-size="2.5" fill="#FFFFFF">CMP</text>
  <text x="13" y="10.5" font-family="monospace" font-size="2.5" fill="#FFFFFF">CALL</text>

  <!-- Highlight gloss effect -->
  <ellipse cx="8" cy="6" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
