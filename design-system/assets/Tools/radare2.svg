<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="radare2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D84315;stop-opacity:1" />
    </linearGradient>
    <filter id="radare2ShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#BF360C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Radare2 background shape (terminal/console style) -->
  <rect x="2" y="2" width="20" height="20" rx="2" fill="url(#radare2Gradient)" stroke="#BF360C" stroke-width="0.8" filter="url(#radare2ShadowFilter)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="#FFCCBC" stroke-width="0.5" opacity="0.6"/>

  <!-- Radare2 "r2" text -->
  <text x="6" y="14" font-family="monospace" font-size="8" font-weight="bold" fill="#FFFFFF">r2</text>

  <!-- Terminal cursor -->
  <rect x="17" y="11" width="1.5" height="8" fill="#00FF00" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Disassembly hex pattern -->
  <text x="4" y="8" font-family="monospace" font-size="3.5" fill="#FFFFFF" opacity="0.7">0x</text>
  <text x="4" y="19" font-family="monospace" font-size="3.5" fill="#FFFFFF" opacity="0.7">48</text>
  <text x="18" y="8" font-family="monospace" font-size="3.5" fill="#FFFFFF" opacity="0.5">89</text>
  <text x="18" y="19" font-family="monospace" font-size="3.5" fill="#FFFFFF" opacity="0.5">e5</text>

  <!-- Highlight gloss effect -->
  <ellipse cx="8" cy="6" rx="4" ry="2" fill="#FFFFFF" opacity="0.2"/>
</svg>
