<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="helpDocsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <filter id="helpDocsShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#1B5E20" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Documentation book/manual -->
  <rect x="4" y="2" width="16" height="20" rx="2"
        fill="url(#helpDocsGradient)" stroke="#1B5E20" stroke-width="0.8" filter="url(#helpDocsShadowFilter)"/>

  <!-- Book spine -->
  <rect x="4" y="2" width="2" height="20" rx="2" fill="#388E3C"/>
  <text x="5" y="12" font-family="Arial" font-size="1.5" text-anchor="middle" fill="#FFFFFF" font-weight="bold" transform="rotate(-90 5 12)">DOCS</text>

  <!-- Page content area -->
  <rect x="7" y="4" width="12" height="17" rx="1" fill="#FFFFFF"/>

  <!-- Documentation title -->
  <rect x="8" y="5" width="10" height="2" rx="0.3" fill="#4CAF50"/>
  <text x="13" y="6.5" font-family="Arial" font-size="2" text-anchor="middle" fill="#FFFFFF" font-weight="bold">User Guide</text>

  <!-- Documentation sections -->
  <rect x="8" y="8" width="8" height="0.8" rx="0.2" fill="#81C784"/>
  <rect x="8" y="10" width="10" height="0.8" rx="0.2" fill="#A5D6A7"/>
  <rect x="8" y="12" width="6" height="0.8" rx="0.2" fill="#C8E6C9"/>

  <!-- Text content lines -->
  <rect x="8" y="14" width="9" height="0.4" rx="0.2" fill="#E0E0E0"/>
  <rect x="8" y="15" width="10" height="0.4" rx="0.2" fill="#E0E0E0"/>
  <rect x="8" y="16" width="7" height="0.4" rx="0.2" fill="#E0E0E0"/>
  <rect x="8" y="17" width="8" height="0.4" rx="0.2" fill="#E0E0E0"/>
  <rect x="8" y="18" width="9" height="0.4" rx="0.2" fill="#E0E0E0"/>

  <!-- Help icon in corner -->
  <circle cx="17" cy="19" r="1.5" fill="#FF9800"/>
  <text x="17" y="19.4" font-family="Arial" font-size="1.8" text-anchor="middle" fill="#FFFFFF" font-weight="bold">?</text>

  <!-- Bookmark -->
  <polygon points="18,2 20,2 20,8 19,7 18,8" fill="#F44336"/>

  <!-- Page corner fold -->
  <polygon points="17,4 19,4 19,6" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="0.3"/>
  <path d="M17 4 L17 6 L19 6" stroke="#CCCCCC" stroke-width="0.3"/>

  <!-- Search/index tab -->
  <rect x="20" y="8" width="2" height="4" rx="1" fill="#2196F3"/>
  <text x="21" y="10.2" font-family="monospace" font-size="1.2" text-anchor="middle" fill="#FFFFFF" font-weight="bold">i</text>

  <!-- Highlight gloss effect -->
  <ellipse cx="10" cy="5" rx="4" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
