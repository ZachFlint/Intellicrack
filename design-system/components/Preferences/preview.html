<div class="sp"><style>.sp{padding:24px;background:var(--ic-window);color:var(--ic-text);font-family:var(--ic-font-ui);font-size:var(--ic-fs-12);line-height:1.4}.sp-flush{padding:0}.sp-stack{display:flex;flex-direction:column;gap:16px}.sp-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.sp-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.sp-lbl{font-size:var(--ic-fs-11);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ic-text-muted);margin-bottom:8px}.sp-item{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.sp-cap{font-family:var(--ic-font-code);font-size:var(--ic-fs-11);color:var(--ic-text-muted)}</style><div class="ic-prefs" style="max-width:640px;height:400px"><div class="ic-prefs-categories"><div class="ic-prefs-category">General</div><div class="ic-prefs-category is-selected">Appearance</div><div class="ic-prefs-category">Providers</div><div class="ic-prefs-category is-hover">Tools</div><div class="ic-prefs-category">Sandbox</div><div class="ic-prefs-category">Shortcuts</div><div class="ic-prefs-category">Advanced</div></div><div class="ic-prefs-stack"><div class="ic-groupbox"><div class="ic-groupbox-title">Theme</div><div class="sp-stack" style="gap:10px"><label class="ic-radio is-checked"><span class="ic-radio-dot"></span> Dark</label><label class="ic-radio"><span class="ic-radio-dot"></span> Light</label><label class="ic-radio"><span class="ic-radio-dot"></span> Dark 2</label><label class="ic-radio"><span class="ic-radio-dot"></span> Light 2</label><label class="ic-radio"><span class="ic-radio-dot"></span> Follow system</label></div></div><div class="ic-groupbox" style="margin-top:20px"><div class="ic-groupbox-title">Fonts</div><div class="sp-row"><span>Code font size</span><span class="ic-spin"><span class="ic-spin-value">10</span><span class="ic-spin-buttons"><span class="ic-spin-btn">&#9650;</span><span class="ic-spin-btn">&#9660;</span></span></span></div></div></
