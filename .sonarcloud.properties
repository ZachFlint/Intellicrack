# SonarQube Cloud automatic analysis configuration.
#
# Read only by automatic analysis (the SonarCloud GitHub App). A CI-based
# scanner reads sonar-project.properties instead. The keys below are the full
# set automatic analysis accepts; see
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# Scope mirrors the other analyzers (qodana.yaml, .codeqlignore): vendored
# code, third-party SDKs, type stubs and generated output stay out.

# ---------------------------------------------------------------------------
# Production code
# ---------------------------------------------------------------------------
# .github is included so the GitHub Actions security rules run on workflows.
sonar.sources=src,scripts,packaging,docker,.github
sonar.exclusions=\
  src/hexbench/tests/**,\
  src/hexbench/design/cards/**,\
  src/hexbench/design/index.html,\
  src/intellicrack-hexcore/target/**,\
  packaging/version.generated.iss,\
  **/__pycache__/**,\
  **/*.png,\
  **/*.ico

# ---------------------------------------------------------------------------
# Test code (analyzed with test rules, not production rules)
# ---------------------------------------------------------------------------
sonar.tests=tests,src/hexbench/tests
# Fixtures are raw ELF/Mach-O binaries; reading them as text is what produced
# the "problems with file encoding" warning.
sonar.test.exclusions=\
  tests/fixtures/**,\
  **/__pycache__/**

# ---------------------------------------------------------------------------
# Language settings
# ---------------------------------------------------------------------------
# Every tracked text file is UTF-8 (.editorconfig, .gitattributes).
sonar.sourceEncoding=UTF-8

# Matches requires-python in pyproject.toml and the pixi python pin.
sonar.python.version=3.13

# ---------------------------------------------------------------------------
# Duplication
# ---------------------------------------------------------------------------
# Packaging specs and CI workflows repeat boilerplate by design.
sonar.cpd.exclusions=\
  packaging/**,\
  .github/**
