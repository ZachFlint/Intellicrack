<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="scanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <filter id="scanShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#1B5E20" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Scan target/crosshairs -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="url(#scanGradient)" stroke-width="1.5" filter="url(#scanShadowFilter)"/>
  <circle cx="12" cy="12" r="6" fill="none" stroke="url(#scanGradient)" stroke-width="1.2"/>
  <circle cx="12" cy="12" r="3" fill="none" stroke="url(#scanGradient)" stroke-width="1"/>

  <!-- Crosshairs -->
  <path d="M12 2 L12 6" stroke="url(#scanGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 18 L12 22" stroke="url(#scanGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M2 12 L6 12" stroke="url(#scanGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 12 L22 12" stroke="url(#scanGradient)" stroke-width="2" stroke-linecap="round"/>

  <!-- Corner brackets (scanner frame) -->
  <path d="M4 4 L4 7 M4 4 L7 4" stroke="#FF9800" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 4 L20 7 M20 4 L17 4" stroke="#FF9800" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M4 20 L4 17 M4 20 L7 20" stroke="#FF9800" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 20 L20 17 M20 20 L17 20" stroke="#FF9800" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central scan indicator -->
  <circle cx="12" cy="12" r="1.5" fill="#FFD700"/>
  <circle cx="12" cy="12" r="0.8" fill="#FF8F00"/>

  <!-- Scanning beam effect -->
  <path d="M12 12 L18 6" stroke="#4CAF50" stroke-width="1.5" opacity="0.7">
    <animateTransform attributeName="transform" attributeType="XML"
                      type="rotate" from="0 12 12" to="360 12 12"
                      dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Highlight gloss effect -->
  <ellipse cx="9" cy="7" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
