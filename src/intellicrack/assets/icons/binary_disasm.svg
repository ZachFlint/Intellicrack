<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="disasmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3F51B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A237E;stop-opacity:1" />
    </linearGradient>
    <filter id="disasmShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#0D1B5E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Disassembly window background -->
  <rect x="2" y="2" width="20" height="20" rx="2"
        fill="url(#disasmGradient)" stroke="#0D1B5E" stroke-width="0.8" filter="url(#disasmShadowFilter)"/>

  <!-- Terminal/console styling -->
  <rect x="3" y="3" width="18" height="18" rx="1" fill="#263238"/>

  <!-- Assembly code lines -->
  <text x="4" y="7" font-family="monospace" font-size="2.5" fill="#4CAF50">0x401000</text>
  <text x="12" y="7" font-family="monospace" font-size="2.5" fill="#FFFFFF">MOV EAX, EBX</text>

  <text x="4" y="10" font-family="monospace" font-size="2.5" fill="#4CAF50">0x401003</text>
  <text x="12" y="10" font-family="monospace" font-size="2.5" fill="#FFFFFF">CMP EAX, 0</text>

  <text x="4" y="13" font-family="monospace" font-size="2.5" fill="#4CAF50">0x401006</text>
  <text x="12" y="13" font-family="monospace" font-size="2.5" fill="#FFFFFF">JE 401015</text>

  <text x="4" y="16" font-family="monospace" font-size="2.5" fill="#4CAF50">0x401008</text>
  <text x="12" y="16" font-family="monospace" font-size="2.5" fill="#FFFFFF">CALL func</text>

  <text x="4" y="19" font-family="monospace" font-size="2.5" fill="#4CAF50">0x40100D</text>
  <text x="12" y="19" font-family="monospace" font-size="2.5" fill="#FFFFFF">RET</text>

  <!-- Instruction pointer/current line highlight -->
  <rect x="3.5" y="11.5" width="17" height="2.5" fill="#FF9800" opacity="0.3"/>
  <rect x="3" y="11.5" width="0.5" height="2.5" fill="#FF5722"/>

  <!-- Binary to assembly conversion arrows -->
  <path d="M19 4 Q21 4 21 6 Q21 8 19 8" stroke="#FFD54F" stroke-width="1.5" fill="none" marker-end="url(#disasmArrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="disasmArrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <polygon points="0,0 5,2.5 0,5" fill="#FFD54F"/>
    </marker>
  </defs>

  <!-- CPU architecture indicator -->
  <circle cx="19" cy="19" r="2" fill="#5C6BC0"/>
  <text x="19" y="19.5" font-family="monospace" font-size="2" text-anchor="middle" fill="#FFFFFF">x86</text>

  <!-- Highlight gloss effect -->
  <ellipse cx="8" cy="5" rx="4" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
