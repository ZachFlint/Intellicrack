<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#1B5E20" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Success circle background -->
  <circle cx="12" cy="12" r="11" fill="url(#successGradient)" stroke="#1B5E20" stroke-width="0.8" filter="url(#shadowFilter)"/>
  <circle cx="12" cy="12" r="8.5" fill="none" stroke="#A5D6A7" stroke-width="0.5" opacity="0.6"/>

  <!-- Checkmark -->
  <path d="M7.5 12 L10.5 15 L16.5 9" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Highlight gloss effect -->
  <ellipse cx="10" cy="8" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
