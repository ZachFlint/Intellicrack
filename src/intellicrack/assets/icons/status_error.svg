<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="errorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C62828;stop-opacity:1" />
    </linearGradient>
    <filter id="errorShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#B71C1C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Error circle background -->
  <circle cx="12" cy="12" r="11" fill="url(#errorGradient)" stroke="#B71C1C" stroke-width="0.8" filter="url(#errorShadowFilter)"/>
  <circle cx="12" cy="12" r="8.5" fill="none" stroke="#FFCDD2" stroke-width="0.5" opacity="0.6"/>

  <!-- X mark -->
  <path d="M8.5 8.5 L15.5 15.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M15.5 8.5 L8.5 15.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Highlight gloss effect -->
  <ellipse cx="10" cy="8" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
