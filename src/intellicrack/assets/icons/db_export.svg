<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="dbExportGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1" />
    </linearGradient>
    <filter id="dbExportShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#BF360C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Database (source) -->
  <ellipse cx="6" cy="6" rx="3" ry="1.5" fill="url(#dbExportGradient)" stroke="#BF360C" stroke-width="0.5" filter="url(#dbExportShadowFilter)"/>
  <rect x="3" y="6" width="6" height="6" fill="url(#dbExportGradient)"/>
  <ellipse cx="6" cy="12" rx="3" ry="1.5" fill="#FFB74D" stroke="#E65100" stroke-width="0.3"/>

  <!-- Database layers -->
  <ellipse cx="6" cy="8" rx="3" ry="0.8" fill="none" stroke="#FFE0B2" stroke-width="0.3" opacity="0.8"/>
  <ellipse cx="6" cy="10" rx="3" ry="0.8" fill="none" stroke="#FFE0B2" stroke-width="0.3" opacity="0.6"/>

  <!-- Export arrow -->
  <path d="M9 9 L15 9" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#exportArrow)"/>
  <path d="M13 7 L15 9 L13 11" stroke="#4CAF50" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="exportArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#4CAF50"/>
    </marker>
  </defs>

  <!-- Export file formats -->
  <rect x="16" y="4" width="6" height="4" rx="0.5" fill="#E3F2FD" stroke="#2196F3" stroke-width="0.5"/>
  <text x="19" y="6.5" font-family="monospace" font-size="2" text-anchor="middle" fill="#1976D2" font-weight="bold">CSV</text>

  <rect x="16" y="9" width="6" height="4" rx="0.5" fill="#F3E5F5" stroke="#9C27B0" stroke-width="0.5"/>
  <text x="19" y="11.5" font-family="monospace" font-size="2" text-anchor="middle" fill="#7B1FA2" font-weight="bold">JSON</text>

  <rect x="16" y="14" width="6" height="4" rx="0.5" fill="#E8F5E8" stroke="#4CAF50" stroke-width="0.5"/>
  <text x="19" y="16.5" font-family="monospace" font-size="2" text-anchor="middle" fill="#388E3C" font-weight="bold">XML</text>

  <!-- Data flow indicators -->
  <circle cx="11" cy="6" r="0.5" fill="#FFD54F">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="13" cy="7.5" r="0.5" fill="#FFA726">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="11" cy="12" r="0.5" fill="#FF8F00">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="13" cy="10.5" r="0.5" fill="#FF6F00">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
  </circle>

  <!-- Export progress bar -->
  <rect x="3" y="20" width="18" height="2" rx="1" fill="#E0E0E0"/>
  <rect x="3" y="20" width="12" height="2" rx="1" fill="#4CAF50">
    <animate attributeName="width" values="0;18;0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Export label -->
  <text x="12" y="19" font-family="monospace" font-size="1.8" text-anchor="middle" fill="#666">EXPORT</text>

  <!-- Database label -->
  <text x="6" y="15" font-family="monospace" font-size="1.5" text-anchor="middle" fill="#E65100">DB</text>

  <!-- Highlight gloss effect -->
  <ellipse cx="5" cy="5" rx="2" ry="1" fill="#FFFFFF" opacity="0.3"/>
</svg>
