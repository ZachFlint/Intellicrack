<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="ghidraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <filter id="ghidraShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#1B5E20" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ghidra background shape (NSA/Government styling) -->
  <polygon points="12,2 22,8 22,16 12,22 2,16 2,8" fill="url(#ghidraGradient)" stroke="#1B5E20" stroke-width="0.8" filter="url(#ghidraShadowFilter)"/>

  <!-- Ghidra "G" stylized -->
  <path d="M8 8 Q6 8 6 10 Q6 14 6 16 Q6 18 8 18 L14 18 L14 15 L11 15" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11 15 L14 15 L14 12 L11 12" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dragon head silhouette (Ghidra reference) -->
  <path d="M16 6 Q18 5 19 7 Q20 8 19 10 L17 12 Q16 11 16 9 Z" fill="#FFD700" stroke="#FF8F00" stroke-width="0.5" opacity="0.8"/>

  <!-- Binary/hex pattern -->
  <circle cx="18" cy="16" r="0.8" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="16.5" cy="18" r="0.6" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="19.5" cy="18" r="0.6" fill="#FFFFFF" opacity="0.4"/>

  <!-- Highlight gloss effect -->
  <ellipse cx="10" cy="7" rx="4" ry="2" fill="#FFFFFF" opacity="0.2"/>
</svg>
