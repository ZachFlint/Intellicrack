<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="trainingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <filter id="trainingShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#01579B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Training progress circle -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="#E3F2FD" stroke-width="2"/>
  <circle cx="12" cy="12" r="9" fill="none" stroke="url(#trainingGradient)"
          stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="35 21"
          transform="rotate(-90 12 12)" filter="url(#trainingShadowFilter)">
    <animateTransform attributeName="transform"
                      type="rotate" from="-90 12 12" to="270 12 12"
                      dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Training data points -->
  <circle cx="6" cy="8" r="1.2" fill="#4CAF50"/>
  <circle cx="18" cy="8" r="1.2" fill="#4CAF50"/>
  <circle cx="6" cy="16" r="1.2" fill="#FF9800"/>
  <circle cx="18" cy="16" r="1.2" fill="#FF9800"/>

  <!-- Central processing unit -->
  <rect x="9" y="9" width="6" height="6" rx="1" fill="url(#trainingGradient)" stroke="#01579B" stroke-width="0.5"/>
  <rect x="10" y="10" width="4" height="4" rx="0.5" fill="#BBDEFB"/>

  <!-- Training iterations indicator -->
  <text x="12" y="13.5" font-family="monospace" font-size="3" text-anchor="middle" fill="#0D47A1" font-weight="bold">AI</text>

  <!-- Data flow arrows -->
  <path d="M7.2 8 L8.5 9.5" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M16.8 8 L15.5 9.5" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M7.2 16 L8.5 14.5" stroke="#FF9800" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path d="M16.8 16 L15.5 14.5" stroke="#FF9800" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto">
      <polygon points="0,0 5,2.5 0,5" fill="#4CAF50"/>
    </marker>
    <marker id="arrowOrange" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto">
      <polygon points="0,0 5,2.5 0,5" fill="#FF9800"/>
    </marker>
  </defs>

  <!-- Training metrics -->
  <circle cx="4" cy="4" r="1" fill="#F44336">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="6.5" y="5" font-family="monospace" font-size="2.5" fill="#666">Loss</text>
</svg>
