<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="neuralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00695C;stop-opacity:1" />
    </linearGradient>
    <filter id="neuralShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#004D40" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Neural network layers -->
  <!-- Input layer -->
  <circle cx="4" cy="6" r="1.5" fill="url(#neuralGradient)" stroke="#004D40" stroke-width="0.5" filter="url(#neuralShadowFilter)"/>
  <circle cx="4" cy="12" r="1.5" fill="url(#neuralGradient)" stroke="#004D40" stroke-width="0.5"/>
  <circle cx="4" cy="18" r="1.5" fill="url(#neuralGradient)" stroke="#004D40" stroke-width="0.5"/>

  <!-- Hidden layer 1 -->
  <circle cx="10" cy="4" r="1.5" fill="#26A69A" stroke="#00695C" stroke-width="0.5"/>
  <circle cx="10" cy="8" r="1.5" fill="#26A69A" stroke="#00695C" stroke-width="0.5"/>
  <circle cx="10" cy="12" r="1.5" fill="#26A69A" stroke="#00695C" stroke-width="0.5"/>
  <circle cx="10" cy="16" r="1.5" fill="#26A69A" stroke="#00695C" stroke-width="0.5"/>
  <circle cx="10" cy="20" r="1.5" fill="#26A69A" stroke="#00695C" stroke-width="0.5"/>

  <!-- Hidden layer 2 -->
  <circle cx="16" cy="6" r="1.5" fill="#4DB6AC" stroke="#00796B" stroke-width="0.5"/>
  <circle cx="16" cy="12" r="1.5" fill="#4DB6AC" stroke="#00796B" stroke-width="0.5"/>
  <circle cx="16" cy="18" r="1.5" fill="#4DB6AC" stroke="#00796B" stroke-width="0.5"/>

  <!-- Output layer -->
  <circle cx="22" cy="12" r="1.5" fill="#80CBC4" stroke="#00897B" stroke-width="0.5"/>

  <!-- Neural connections -->
  <!-- Input to Hidden 1 -->
  <path d="M5.5 6 L8.5 4" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
  <path d="M5.5 6 L8.5 8" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
  <path d="M5.5 12 L8.5 8" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
  <path d="M5.5 12 L8.5 12" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
  <path d="M5.5 12 L8.5 16" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
  <path d="M5.5 18 L8.5 16" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
  <path d="M5.5 18 L8.5 20" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>

  <!-- Hidden 1 to Hidden 2 -->
  <path d="M11.5 4 L14.5 6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
  <path d="M11.5 8 L14.5 6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
  <path d="M11.5 12 L14.5 12" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
  <path d="M11.5 16 L14.5 18" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
  <path d="M11.5 20 L14.5 18" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>

  <!-- Hidden 2 to Output -->
  <path d="M17.5 6 L20.5 12" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
  <path d="M17.5 12 L20.5 12" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
  <path d="M17.5 18 L20.5 12" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>

  <!-- Highlight gloss effect -->
  <ellipse cx="8" cy="6" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.2"/>
</svg>
