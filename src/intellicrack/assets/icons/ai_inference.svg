<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="inferenceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <filter id="inferenceShadowFilter">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="1" flood-color="#1B5E20" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Inference pipeline -->
  <rect x="2" y="10" width="6" height="4" rx="1"
        fill="#E8F5E8" stroke="url(#inferenceGradient)" stroke-width="1" filter="url(#inferenceShadowFilter)"/>
  <text x="5" y="12.8" font-family="monospace" font-size="2.5" text-anchor="middle" fill="#2E7D32">IN</text>

  <rect x="9" y="6" width="6" height="12" rx="2"
        fill="url(#inferenceGradient)" stroke="#1B5E20" stroke-width="0.8"/>
  <text x="12" y="12.5" font-family="monospace" font-size="3" text-anchor="middle" fill="#FFFFFF" font-weight="bold">AI</text>

  <rect x="16" y="10" width="6" height="4" rx="1"
        fill="#E8F5E8" stroke="url(#inferenceGradient)" stroke-width="1"/>
  <text x="19" y="12.8" font-family="monospace" font-size="2.5" text-anchor="middle" fill="#2E7D32">OUT</text>

  <!-- Data flow arrows -->
  <path d="M8 12 L9 12" stroke="url(#inferenceGradient)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M15 12 L16 12" stroke="url(#inferenceGradient)" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#4CAF50"/>
    </marker>
  </defs>

  <!-- Inference processing indicators -->
  <circle cx="10.5" cy="8" r="0.5" fill="#FFD54F">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="12" cy="9" r="0.5" fill="#FFA726">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="13.5" cy="8" r="0.5" fill="#FF8F00">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Real-time indicator -->
  <rect x="10" y="15" width="4" height="1.5" rx="0.75" fill="#81C784"/>
  <text x="12" y="16" font-family="monospace" font-size="1.8" text-anchor="middle" fill="#FFFFFF">RT</text>

  <!-- Input data visualization -->
  <circle cx="3" cy="8" r="0.8" fill="#2196F3"/>
  <circle cx="5" cy="7" r="0.6" fill="#3F51B5"/>
  <circle cx="7" cy="8.5" r="0.7" fill="#9C27B0"/>

  <!-- Output predictions -->
  <rect x="17" y="7" width="3" height="1" rx="0.5" fill="#4CAF50"/>
  <rect x="17.5" y="15" width="2" height="1" rx="0.5" fill="#8BC34A"/>

  <!-- Highlight gloss effect -->
  <ellipse cx="11" cy="7" rx="2.5" ry="1" fill="#FFFFFF" opacity="0.2"/>
</svg>
