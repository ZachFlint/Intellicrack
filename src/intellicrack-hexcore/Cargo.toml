[package]
name = "intellicrack-hexcore"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "intellicrack_hexcore"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
memmap2 = "0.9.5"
rayon = "1.10.0"
regex = "1.11.1"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.8"
crc32fast = "1.4.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
