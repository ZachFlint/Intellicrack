[package]
name = "intellicrack-hexcore"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[package.metadata.cargo-machete]
ignored = ["md-5"]

[lib]
crate-type = ["cdylib"]
name = "intellicrack_hexcore"

[dependencies]
adler2 = "2.0"
aes = "0.9"
base64 = "0.22"
blake2 = "0.11.0-rc.6"
crc = "3.4"
crc32fast = "1.5.0"
encoding_rs = "0.8"
flate2 = "1.1"
half = "2.7"
md-5 = "0.11.0"
memmap2 = "0.9.11"
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.12.0"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12"
similar = { version = "3.1", default-features = false }
siphasher = "1.0"
thiserror = "2.0.18"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh32", "xxh64"] }

[target."cfg(windows)".dependencies]
windows-sys = {
  version = "0.61",
  features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading"
  ]
}

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
codegen-units = 1
