# MegaLinter configuration for Intellicrack, invoked via `just megalint`
# (scripts/run-megalinter.ps1), which handles the Docker engine switch,
# mega-linter-runner invocation, and the image/container lifecycle around this
# -- the image named by MEGALINTER_VERSION below is installed before the run
# and uninstalled after it, every run.
# https://megalinter.io/latest/config-file/ | https://megalinter.io/latest/config-variables/
MEGALINTER_VERSION: v10
# Scope every linter to src/. Repository-level scanners (BETTERLEAKS, CHECKOV,
# DEVSKIM, DUSTILOCK, GIT_DIFF, GRYPE, JSCPD, KINGFISHER, NPM_PACKAGE_JSON_LINT,
# OSV_SCANNER, SECRETLINT, SYFT, TRIVY, TRIVY_SBOM, TRUFFLEHOG) run in "project"
# CLI_LINT_MODE and ignore this filter by design -- they always walk the whole
# mounted repository instead, regardless of this setting.
FILTER_REGEX_INCLUDE: (src/)
# FILTER_REGEX_INCLUDE does not reach the project-mode scanners above, but
# excluded directories do: MegaLinter forwards them to every project-mode
# linter that has a native exclusion argument (devskim, grype, syft, trivy,
# trivy-sbom, checkov, secretlint, osv-scanner, kingfisher, cspell, lychee all
# declare one), and jscpd gets them through a generated config that merges
# them into its ignore list. MegaLinter's own defaults cover node_modules,
# .venv and the usual caches but know nothing about this repo's large
# non-source trees, so devskim spent 19,796s and grype and syft both hit
# LINTER_TIMEOUT_SECONDS walking them. dustilock, betterleaks and trufflehog
# have no native exclusion argument and still scan everything.
#
# tests/ is here for the same reason: it holds no shipped source, every
# file-based linter already skips it via FILTER_REGEX_INCLUDE above, and it is
# where most of jscpd's duplication lives. Measured with jscpd 5.3.0 under
# MegaLinter's own default ignore list: 1,921 of the 2,866 clones found across
# the repository are inside tests/, against 908 in src/. Test modules repeat
# fixtures and assertion blocks by design, so reporting them as copy-paste
# says nothing about the code under test.
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - .claude
  - .pixi
  - build
  - dist
  - reports
  - target
  - tests
  - tools
  - vendor
# The Windows-host -> Linux-container bind mount is slow enough that on a real
# run against this repo, 14 of ~46 linters blew through the 300s default and
# were killed mid-scan (pylint, pyright, jscpd, npm-package-json-lint, checkov,
# devskim, dustilock, grype, kingfisher, syft, trivy, trivy-sbom, betterleaks,
# trufflehog). Raised generously so a run from Windows actually completes
# instead of silently reporting a timeout as "1 error". The project-mode
# scanners above still walk the entire repo (including .pixi/, which is large)
# with no way to filter them down to src/, so this may still not be enough for
# all of them -- if one keeps timing out, look at that tool's own native
# exclude flag via its MegaLinter <LINTER_KEY>_ARGUMENTS override.
LINTER_TIMEOUT_SECONDS: 1800
# Several bundled Python linters default to looking for their OWN dotfile
# (.ruff.toml, .flake8, .bandit.yml, .pylintrc, .mypy.ini) and silently fall
# back to MegaLinter's bundled copy of that file when it isn't present --
# which is what happened here, since Intellicrack keeps this config in
# pyproject.toml instead (confirmed from the previous run's logs: ruff was
# invoked with `--config /action/lib/.automation/.ruff.toml`, not this
# repo's pyproject.toml, and flagged ExceptionGroup as undefined because that
# bundled default doesn't know this project targets py313). LINTER_DEFAULT
# skips MegaLinter's own override entirely and lets each tool fall back to
# its own normal config discovery, which does check pyproject.toml.
PYTHON_RUFF_CONFIG_FILE: LINTER_DEFAULT
PYTHON_BANDIT_CONFIG_FILE: LINTER_DEFAULT
PYTHON_PYLINT_CONFIG_FILE: LINTER_DEFAULT
PYTHON_MYPY_CONFIG_FILE: LINTER_DEFAULT
PYTHON_FLAKE8_CONFIG_FILE: LINTER_DEFAULT
PYTHON_ISORT_CONFIG_FILE: LINTER_DEFAULT
# LINTER_DEFAULT is not enough for flake8 on its own. Vanilla flake8 reads
# setup.cfg, tox.ini and .flake8, never pyproject.toml, and this repo keeps
# its settings in a [tool.flake8] table there (max-line-length 140 plus a
# large exclude/extend-ignore list). Reading pyproject.toml takes the
# flake8-pyproject plugin, which is in this project's own requirements but
# not in MegaLinter's image -- its flake8 venv holds flake8 7.3.0 and nothing
# else. So the container ran flake8 at stock defaults, above all
# max-line-length 79 against a codebase written to 140, and reported 18,774
# findings. Measured with flake8 7.3.0 over the same 268 files: 16,485 of
# 16,593 findings were E501 alone, and installing flake8-pyproject so the
# [tool.flake8] table is honoured takes the total to 74. The version below
# is the one requirements.txt pins, so the container runs what this project
# runs.
PYTHON_FLAKE8_PRE_COMMANDS:
  - command: "pip install flake8-pyproject==1.2.4"
    venv: flake8
    continue_if_failed: false
# PYTHON_BLACK's own default is already pyproject.toml, and this repo has a
# real [tool.black] table, so it needs no override. PYTHON_PYRIGHT's own
# default is already pyrightconfig.json, and this repo has a real, strict one
# at the root -- also needs no override, and (once the timeout below stops
# killing it) will actually type-check against this project's real settings.
# It is still upstream pyright, not this project's actual basedpyright, so it
# won't enforce basedpyright's own additional rules on top of that config --
# but it is no longer the "different config entirely" gap this comment used
# to describe. pylint, isort and mypy genuinely have no project config to
# find (pyproject.toml has no [tool.isort]/[tool.pylint]/[tool.mypy] table,
# and ruff/basedpyright are this project's actual tools of record for that
# ground), so LINTER_DEFAULT for them mainly avoids MegaLinter's bundled
# opinionated config rather than unlocking a real one -- treat their findings
# as advisory, not as gates. pylint's 8,926 is dominated by the same
# line-length gap: measured over the same 268 files, 4,765 of 8,289 findings
# are C0301 at pylint's stock 100 columns and another 1,062 are W0201, which
# every PyQt6 widget that assigns children outside __init__ trips by design.
# RUST_CLIPPY's default "project" CLI_LINT_MODE assumes the mounted repo root
# is the crate root, so it fails instantly with "could not find Cargo.toml"
# against this repo (the crate lives at src/intellicrack-hexcore). Point it at
# the real manifest explicitly, the same way `cargo clippy --manifest-path=...`
# would. hexcore has no [lints]/[workspace.lints] table in Cargo.toml, so its
# real lint strictness comes entirely from the CLI flags in the `clippy`
# justfile recipe (--all-targets -- -W clippy::all -W clippy::pedantic) --
# replicated here too, since without them clippy only runs at its bare
# built-in default (roughly clippy::all already, but without ::pedantic) and
# silently under-reports relative to `just clippy`. Note this also means
# clippy compiles intellicrack-hexcore from scratch on every `just megalint`
# run, since the container (and its cargo registry/target cache) is removed
# afterwards, along with the image itself -- expect this step to be slow;
# `just clippy` remains the fast, incrementally-cached tool for routine use.
# The leading `clippy` is required, not a typo. MegaLinter's cli_executable is
# the bare `cargo-clippy` binary, which expects to be spawned by cargo as
# `cargo clippy` and so discards its own first argument. Without the
# placeholder it swallowed --manifest-path and died in under a second with
# "could not find Cargo.toml in /tmp/lint or any parent directory", which the
# summary table reported as a single opaque error. Reproduced and fixed
# against cargo-clippy 1.94.1.
RUST_CLIPPY_ARGUMENTS: >-
  clippy --manifest-path=src/intellicrack-hexcore/Cargo.toml --all-targets -- -W clippy::all -W clippy::pedantic
# lychee reported two failures that are environmental rather than broken links.
# --root-dir resolves root-relative hrefs (src/hexbench/static/index.html links
# /static/app.css, which lychee cannot resolve in a local file without one) and
# must be absolute, so it points at the container mount for the same reason
# REPORT_OUTPUT_FOLDER below does. --exclude-loopback stops it trying to HTTP
# GET the Ollama endpoint http://localhost:11434/ out of
# src/intellicrack/assets/configs/ollama_codellama.json, which is a provider
# endpoint in a config file and was never a link to check.
# --root-dir is the document root for root-relative hrefs, not the repo root.
# src/hexbench/static/index.html is the only linted file with any, and it is
# served by hexbench with src/hexbench as the web root: /static/app.css is
# src/hexbench/static/app.css on disk. /tmp/lint resolved it to
# /tmp/lint/static/app.css, which does not exist.
SPELL_LYCHEE_ARGUMENTS: >-
  --root-dir /tmp/lint/src/hexbench --exclude-loopback
# Relocate the report folder to match the rest of the repo's reports/
# convention, and reset it on every run so stale findings from a previous
# `just megalint` never mix with the current one.
# This MUST be an absolute container path. MegaLinter joins the workspace onto
# its own default only (MegaLinter.py initialize_output); a value supplied here
# is used verbatim, and the image's WORKDIR is / with nothing chdir-ing into
# the workspace on the normal run path, so a relative value like
# `reports/megalinter` lands in the container's own filesystem and is destroyed
# with the container. /tmp/lint is where mega-linter-runner bind-mounts the
# repo, so this resolves to <repo>/reports/megalinter on the host.
REPORT_OUTPUT_FOLDER: /tmp/lint/reports/megalinter
CLEAR_REPORT_FOLDER: true
# Always scan every matching file under the filter above, not just files
# touched since the last commit -- there is no meaningful git diff for a local
# ad hoc run.
VALIDATE_ALL_CODEBASE: true
# Posts a PR status via the GitHub API; only meaningful inside a GitHub
# Actions PR run. `just megalint` never runs in that context, so this is
# disabled rather than left to fail or log noise locally.
GITHUB_STATUS_REPORTER: false
