tasks.dev = "python -m intellicrack"
tasks.gui = "python -m intellicrack.ui.app"
tasks.test = "just test"
tasks.lint = "just lint"
tasks.format = "just ruff-fmt"
tasks.typecheck = "just basedpyright"
tasks.fix-pyqt6-stubs = "python scripts/fix_pyqt6_stubs.py"
tasks.pyright = "basedpyright"
workspace.name = "Intellicrack"
workspace.version = "0.1.0a1"
workspace.description = "Intellicrack: AI-powered reverse engineering orchestration platform"
workspace.authors = ["Zachary Flint <zach.flint2@gmail.com>"]
workspace.channels = ["conda-forge"]
workspace.platforms = ["win-64"]
workspace.preview = ["pixi-build"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = true
check-yield-types = true
allow-init-docstring = true

[tool.pydocstyle]
convention = "google"
match-dir = "(?!tests|docs|tools|build|dist|node_modules|vendor|\\.).*"

[tool.pytest]
ini_options.addopts = ["-ra", "--strict-markers"]
ini_options.markers = [
  "slow: Slow running tests",
  "integration: Integration tests",
  "unit: Unit tests",
  "xpu: Tests requiring Intel XPU hardware",
  "b580: Tests specific to Intel Arc B580 GPU",
  "spawns_process: Test spawns external OS processes; runs only inside the Docker sandbox",
]
ini_options.minversion = "8.0"
ini_options.python_classes = ["Test*"]
ini_options.python_files = ["test_*.py", "*_test.py"]
ini_options.python_functions = ["test_*"]
ini_options.pythonpath = ["src"]
ini_options.testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 140
src = ["."]
exclude = [
  "*.egg-info/",
  ".claude/",
  ".git/",
  ".github/",
  ".idea/",
  ".mypy_cache/",
  ".pixi/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".semgrep/",
  ".serena/",
  ".venv/",
  ".venv*/",
  ".vscode/",
  "__pycache__/",
  "build/",
  "CLI Coding/",
  "dist/",
  "docs/",
  "notebooks/",
  "node_modules/",
  "Screenshots/",
  "stubs/",
  "tools/",
  "typings/",
  "vendor/",
  "vulture_whitelist.py",
]
force-exclude = true
preview = true
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "cr-lf"
format.skip-magic-trailing-comma = false
format.docstring-code-format = true
lint.select = [
  "A",  # flake8-builtins
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "ASYNC",  # flake8-async
  "B",  # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",  # flake8-comprehensions
  "C90",  # mccabe complexity
  "COM",  # flake8-commas
  "CPY",  # flake8-copyright
  "D",  # pydocstyle
  "DOC",  # pydoclint
  "DTZ",  # flake8-datetimez
  "E",  # pycodestyle errors
  "EM",  # flake8-errmsg
  "ERA",  # eradicate (commented-out code)
  "F",  # pyflakes
  "FBT",  # flake8-boolean-trap
  "FIX",  # flake8-fixme (TODO/FIXME)
  "FLY",  # flynt (f-string conversion)
  "FURB",  # refurb (code modernization)
  "G",  # flake8-logging-format
  "I",  # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",  # pep8-naming
  "PERF",  # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi (stub files)
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific
  "S",  # bandit security
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",  # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = [
  "DOC202",  # conflicts with pydoclint DOC201/DOC203 for abstract-style methods that always raise but declare a non-None return type honored by subclasses
  "DOC502",  # conflicts with pydoclint DOC501/DOC503 for re-raised exceptions caught in except blocks
  "E501",  # line-too-long
  "PLR0911",  # too-many-return-statements
  "PLR0912",  # too-many-branches
  "PLR0913",  # too-many-arguments
  "PLR0915",  # too-many-statements
  "PLR1702",  # too-many-nested-blocks
  "S405",  # project-wide: write-side xml.etree usage is centralized in ``intellicrack.core.xml_gen``; parsing of untrusted XML uses ``defusedxml`` elsewhere -- see ``[tool.bandit] skips`` for the matching rationale
]
lint.per-file-ignores.".claude/**" = ["S404"]
lint.per-file-ignores."docker/**" = ["N999", "S404", "S603", "S607", "T201"]
lint.per-file-ignores."scripts/**" = ["N999", "S404", "S603", "S607", "T201"]
lint.per-file-ignores."src/intellicrack/bridges/win32_types.py" = ["N801"]
lint.per-file-ignores."src/intellicrack/bridges/process.py" = ["N801"]
lint.per-file-ignores."src/intellicrack/core/hexpat/evaluator.py" = [
  "C901",
  "PLR0914",
  "PLR2004",
  "TRY003",
]
lint.per-file-ignores."src/intellicrack/core/hexpat/interpreter.py" = ["PLC0415"]
lint.per-file-ignores."src/intellicrack/core/hexpat/lexer.py" = ["C901"]
lint.per-file-ignores."src/intellicrack/core/hexpat/parser.py" = ["C901", "PLR0914"]
lint.per-file-ignores."src/intellicrack/core/hexpat/preprocessor.py" = ["PLR0914"]
lint.per-file-ignores."src/intellicrack/core/hexpat/stdlib.py" = ["PLR2004", "TRY003"]
lint.per-file-ignores."src/intellicrack/core/orchestrator.py" = ["PLC0415"]
lint.per-file-ignores."src/intellicrack/core/tools.py" = ["PLC0415"]
lint.per-file-ignores."src/intellicrack/main.py" = ["PLC0415"]
lint.per-file-ignores."src/intellicrack/ui/app.py" = ["PLC0415"]
lint.per-file-ignores."src/intellicrack/ui/panels/frida_panel.py" = ["PLR0914"]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor/_disassembly.py" = ["PLR0914"]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor/_search.py" = ["PLR0914"]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor/_widgets.py" = ["N802"]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor/panel.py" = ["PLR0914"]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor_panel.py" = [
  "N802",
  "PLR0914",
  "S324",
]
lint.per-file-ignores."tests/**" = [
  "B009",
  "B010",
  "PLC2701",
  "PLR2004",
  "PLR6301",
  "S101",
  "S102",
  "S105",
  "S106",
  "S107",
  "S404",
  "S603",
  "SLF001",
  "TC006",
]
lint.fixable = ["ALL"]
lint.unfixable = ["PTH123", "RET503", "RUF013", "RUF022", "TID252", "TRY400"]
lint.dummy-variable-rgx = "^(_+|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = ["intellicrack"]
lint.isort.lines-after-imports = 2
lint.mccabe.max-complexity = 30
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 20
lint.pylint.max-branches = 25
lint.pylint.max-public-methods = 50
lint.pylint.max-statements = 100

[tool.tombi.files]
include = ["**/*.toml"]
exclude = [
  ".pixi/**",
  ".claude/**",
  "node_modules/**",
  "build/**",
  "dist/**",
  "tools/**",
  "vendor/**",
  ".venv*/**",
  ".pytest_cache/**",
  "target/**",
]

[tool.tombi.format.rules]
line-width = 100

[tool.tombi.lint.rules]
dotted-keys-out-of-order = "error"
key-empty = "error"
tables-out-of-order = "error"

[tool.tombi.extensions."tombi-toml/cargo"]
enabled = true

# git-cliff configuration lives in cliff.toml at project root.
# Do NOT add [tool.git-cliff.*] here: configparser-based tools
# (radon/xenon and similar) read the entire [tool] table and choke on
# the '%' characters in Tera template strings.

[tool.tombi.extensions."tombi-toml/pyproject"]
enabled = true

[tool.ty.src]
exclude = ["notebooks/", "vendor/"]

[tool.vulture]
min_confidence = 80
ignore_decorators = [
  "@abstractmethod",
  "@abc.abstractmethod",
  "@property",
  "@*.setter",
  "@staticmethod",
  "@classmethod",
  "@override",
]
ignore_names = [
  "argtypes",
  "restype",
  "supports_*",
  "visit_*",
  "do_*",
  "test_*",
  "setUp",
  "tearDown",
  "setUpClass",
  "tearDownClass",
]
exclude = [
  ".git/",
  ".github/",
  ".pixi/",
  "build/",
  "dist/",
  "tools/",
  "docs/",
  "node_modules/",
  "vendor/",
  "CLI Coding/",
  "Screenshots/",
  "typings/",
  "stubs/",
]
