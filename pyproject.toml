commitizen = ">=4.13.9, <5"
bumpversion = ">=0.6.0, <0.7"
pipdeptree = ">=2.33.0, <3"
rope = ">=1.14.0, <2"
astor = ">=0.8.1, <0.9"
yapf = ">=0.43.0, <0.44"
pip-audit = ">=2.10.0, <3"
nodeenv = ">=1.10.0, <2"
twine = ">=6.2.0, <7"
setuptools-scm = ">=9.2.2, <10"
poetry = ">=2.3.2, <3"
pycallgraph2 = ">=1.1.3, <2"
pre-commit-hooks = ">=6.0.0, <7"
interrogate = ">=1.7.0, <2"
deptry = ">=0.25.1, <0.26"
codespell = ">=2.4.2, <3"
detect-secrets = ">=1.5.0, <2"
pyannotate = ">=1.2.0, <2"
flake8-pyproject = ">=1.2.4, <2"
cxxfilt = ">=0.3.0, <0.4"

[tool.pixi.pypi-options]
extra-index-urls = [ "https://download.pytorch.org/whl/xpu" ]
index-strategy = "unsafe-best-match"

[tool.pixi.tasks]
dev = "python -m intellicrack"
gui = "python -m intellicrack.ui.app"
test = "just test"
lint = "just lint"
format = "just ruff-fmt"
typecheck = "just basedpyright"
fix-pyqt6-stubs = "python scripts/fix_pyqt6_stubs.py"
pyright = "basedpyright"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = [ "src" ]
include = [ "intellicrack", "intellicrack.*" ]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [ "tests" ]
addopts = [ "-ra", "--strict-markers" ]
python_files = [ "test_*.py", "*_test.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]
markers = [
  "slow: Slow running tests",
  "integration: Integration tests",
  "unit: Unit tests",
  "xpu: Tests requiring Intel XPU hardware",
  "b580: Tests specific to Intel Arc B580 GPU",
]

[tool.black]
line-length = 100
target-version = [ 'py313' ]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.github
  | \.pixi
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.vscode
  | \.idea
  | \.claude
  | \.serena
  | build
  | dist
  | tools
  | docs
  | node_modules
  | CLI\ Coding
  | Screenshots
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.13"
mypy_path = [ ".", "stubs" ]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
strict = true
exclude = [
  "^tools/",
  "^build/",
  "^dist/",
  "^\\.git/",
  "^\\.github/",
  "^\\.pixi/",
  "^docs/",
  "^\\.mypy_cache/",
  "^\\.pytest_cache/",
  "^\\.ruff_cache/",
  "^\\.claude/",
  "^\\.serena/",
  "^\\.idea/",
  "^\\.vscode/",
  "^node_modules/",
  "^CLI Coding/",
  "^Screenshots/",
]

[[tool.mypy.overrides]]
module = [
  "frida.*",
  "r2pipe.*",
  "ghidra_bridge.*",
  "pefile.*",
  "lief.*",
  "transformers.*",
  "accelerate.*",
  "bitsandbytes.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [ "intellicrack.ui.*" ]
disable_error_code = [ "attr-defined", "misc", "no-any-return", "redundant-cast", "unused-ignore" ]

[tool.basedpyright]
include = [ "src/intellicrack" ]
exclude = [
  "**/__pycache__",
  "**/node_modules",
  "**/.venv",
  "**/build",
  "**/dist",
  "**/.git",
  "**/.github",
  "**/.pytest_cache",
  "**/.mypy_cache",
  "**/.ruff_cache",
  "**/.claude",
  "**/.serena",
  "**/.idea",
  "**/.vscode",
  "tools",
  "docs",
  ".pixi",
  "CLI Coding",
  "Screenshots",
]
typeCheckingMode = "strict"
pythonVersion = "3.13"
pythonPlatform = "Windows"
useLibraryCodeForTypes = false
analyzeUnannotatedFunctions = true
enableTypeIgnoreComments = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportMissingModuleSource = "warning"
reportUndefinedVariable = "error"
reportGeneralTypeIssues = "error"
extraPaths = [ "src" ]

[tool.ruff]
line-length = 140
target-version = "py313"
preview = true
src = [ "." ]
exclude = [
  "tests/",
  ".git/",
  ".github/",
  ".venv/",
  ".pixi/",
  "build/",
  "dist/",
  "*.egg-info/",
  "__pycache__/",
  ".vscode/",
  ".idea/",
  "docs/",
  "tools/",
  ".ruff_cache/",
  ".mypy_cache/",
  ".pytest_cache/",
  ".claude/",
  ".serena/",
  "node_modules/",
  "CLI Coding/",
  "Screenshots/",
  "typings/",
  "stubs/",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "C9",   # mccabe complexity
  "N",    # pep8-naming
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
  "ICN",  # flake8-import-conventions
  "T20",  # flake8-print
  "ARG",  # flake8-unused-arguments
  "G",    # flake8-logging-format
  "TC",   # flake8-type-checking
  "RET",  # flake8-return
  "PL",   # pylint
  "TRY",  # tryceratops
  "RUF",  # ruff-specific
  "PERF", # perflint
  "D",    # pydocstyle
  "S",    # bandit security
]

unfixable = [ "TRY400", "RUF013", "RUF022", "RET503" ]

ignore = [
  "E501",    # line-too-long
  "D107",    # missing-docstring-in-__init__ (conflicts with pydoclint DOC301)
  "D203",    # incorrect-blank-line-before-class
  "D213",    # multi-line-summary-second-line
  "S603",    # subprocess-without-shell-equals-true
  "S607",    # partial-path
  "PLR0911", # too-many-return-statements
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0915", # too-many-statements
  "PLR1702", # too-many-nested-blocks
]

fixable = [ "ALL" ]
dummy-variable-rgx = "^(_+|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [ "S101", "S102", "S404", "PLR6301", "PLR2004", "B009" ]
"scripts/**" = [ "T201", "S404", "S603" ]
".claude/**" = [ "S404" ]
"src/intellicrack/core/tools.py" = [ "PLC0415" ]
"src/intellicrack/main.py" = [ "PLC0415" ]
"src/intellicrack/ui/app.py" = [ "PLC0415" ]
"src/intellicrack/core/hexpat/interpreter.py" = [ "PLC0415" ]
"src/intellicrack/bridges/x64dbg.py" = [ "PLR0904" ]
"src/intellicrack/bridges/ghidra.py" = [ "PLR0904" ]
"src/intellicrack/bridges/hex_editor.py" = [ "PLR0904" ]
"src/intellicrack/ui/tools.py" = [ "PLR0904" ]
"src/intellicrack/ui/panels/async_bridge.py" = [ "UP047" ]
"src/intellicrack/ui/panels/hex_editor_panel.py" = [ "N802", "S324", "PLR0914" ]
"src/intellicrack/ui/panels/hex_editor/panel.py" = [ "PLR0914" ]
"src/intellicrack/ui/panels/hex_editor/_disassembly.py" = [ "PLR0914" ]
"src/intellicrack/ui/panels/hex_editor/_search.py" = [ "PLR0914" ]
"src/intellicrack/ui/panels/hex_editor/_widgets.py" = [ "N802" ]
"src/intellicrack/core/hexpat/evaluator.py" = [ "PLR0914", "PLR2004", "C901", "TRY003" ]
"src/intellicrack/core/hexpat/parser.py" = [ "PLR0914", "C901" ]
"src/intellicrack/core/hexpat/pattern_registry.py" = [ "TC003" ]
"src/intellicrack/core/hexpat/preprocessor.py" = [ "TC003", "PLR0914" ]
"src/intellicrack/core/hexpat/lexer.py" = [ "C901" ]
"src/intellicrack/core/hexpat/ast_nodes.py" = [ "UP040" ]
"src/intellicrack/core/hexpat/stdlib.py" = [ "PLR2004", "TRY003" ]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 25
max-statements = 100
max-public-methods = 50

[tool.ruff.lint.isort]
lines-after-imports = 2
force-wrap-aliases = true
combine-as-imports = true
known-first-party = [ "intellicrack" ]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.flake8]
max-line-length = 140
exclude = [
  ".git",
  ".github",
  ".pixi",
  ".mypy_cache",
