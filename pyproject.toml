[tool.bandit]
exclude_dirs = [
  "tests",
  "docs",
  "tools",
  ".git",
  ".github",
  ".pixi",
  "node_modules",
  "CLI Coding",
  "Screenshots",
]
skips = [ "B101", "B601" ]

[tool.coverage.run]
source = [ "src/intellicrack" ]
omit = [
  "*/.git/*",
  "*/.pixi/*",
  "*/tests/*",
  "*/docs/*",
  "*/__pycache__/*",
  "*/tools/*",
  "*/node_modules/*",
  "*/CLI Coding/*",
  "*/Screenshots/*",
]
branch = true

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"
title = "Intellicrack Coverage Report"

[tool.vulture]
min_confidence = 80
ignore_decorators = [
  "@abstractmethod",
  "@abc.abstractmethod",
  "@property",
  "@*.setter",
  "@staticmethod",
  "@classmethod",
  "@override",
]
ignore_names = [
  "argtypes",
  "restype",
  "supports_*",
  "visit_*",
  "do_*",
  "test_*",
  "setUp",
  "tearDown",
  "setUpClass",
  "tearDownClass",
]
exclude = [
  ".git/",
  ".github/",
  ".pixi/",
  "build/",
  "dist/",
  "tools/",
  "docs/",
  "node_modules/",
  "CLI Coding/",
  "Screenshots/",
  "typings/",
  "stubs/",
]

[tool.deadcode]
exclude = [ "tests", "tools", "docs", ".git", ".pixi", "node_modules", "CLI Coding", "Screenshots" ]
ignore-names = [
  "argtypes",
  "restype",
  "supports_*",
  "test_*",
  "setUp",
  "tearDown",
  "setUpClass",
  "tearDownClass",
]
ignore-definitions-if-decorated-with = [
  "abstractmethod",
  "abc.abstractmethod",
  "property",
  "staticmethod",
  "classmethod",
  "override",
]
ignore-definitions-if-inherits-from = [
  "ToolBridgeBase",
  "StaticAnalysisBridge",
  "DynamicAnalysisBridge",
  "BinaryOperationsBridge",
  "LLMProviderBase",
  "SandboxBase",
  "ABC",
  "abc.ABC",
]
ignore-names-if-inherits-from = [
  "ToolBridgeBase",
  "StaticAnalysisBridge",
  "DynamicAnalysisBridge",
  "BinaryOperationsBridge",
  "LLMProviderBase",
  "SandboxBase",
  "ABC",
  "abc.ABC",
]

[tool.interrogate]
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 0
style = "google"
verbose = 2
exclude = [
  "tests",
  "docs",
  "tools",
  ".git",
  ".github",
  ".pixi",
  "build",
  "dist",
  "node_modules",
  "CLI Coding",
  "Screenshots",
