  "safetensors",
] }

[tool.deptry.package_module_name_map]
keystone-engine = [ "keystone" ]
google-genai = [ "google" ]

[tool.codespell]
skip = ".git,.github,.pixi,build,dist,tools,node_modules,CLI Coding,Screenshots,typings,stubs,*.lock,reports,*.egg-info,*.hta,*.hpp,*.graphml"
ignore-words-list = "lief,crossreference,thirdparty,nd,lod,connin,regist"
