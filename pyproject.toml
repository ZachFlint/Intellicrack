  "stubs",
]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = true
check-yield-types = true

[tool.deptry]
known_first_party = [ "intellicrack" ]
pep621_dev_dependency_groups = [ "dev", "test", "docs", "profile" ]
extend_exclude = [
  "tests",
  "docs",
  "tools",
  "scripts",
  ".git",
  ".github",
  ".pixi",
  ".claude",
  "build",
