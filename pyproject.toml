[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.bandit]
exclude_dirs = [
  "tests",
  "docs",
  "tools",
  ".git",
  ".github",
  ".pixi",
  "node_modules",
  "vendor",
  "CLI Coding",
  "Screenshots",
]
# B405: xml.etree usage is restricted to write-side construction via
# ``intellicrack.core.xml_gen``. That module never parses untrusted input;
# untrusted XML parsing must go through ``defusedxml``. ``defusedxml`` does
# not provide a hardened replacement for write-side ElementTree, so the
# stdlib import is the correct API and this project-wide skip is the
# documented, source-clean alternative to inline ``# nosec`` annotations.
skips = ["B405"]

[tool.black]
line-length = 140
target-version = ["py313"]
include = "\\.pyi?$"
extend-exclude = '''/(
  \.git
  | \.github
  | \.pixi
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.vscode
  | \.idea
  | \.claude
  | \.semgrep
  | \.serena
  | build
  | dist
  | tools
  | docs
  | node_modules
  | vendor
  | CLI\ Coding
  | Screenshots
)/
'''

[tool.codespell]
skip = """\
  .git,.github,.pixi,.claude,.serena,build,dist,tools,vendor,target,node_modules,CLI \
  Coding,Screenshots,typings,stubs,*.lock,reports,*.egg-info,*.hta,*.hpp,*.graphml\
  """
ignore-words-list = "lief,crossreference,thirdparty,nd,lod,connin,regist"
count = true

[tool.coverage]
run.branch = true
run.omit = [
  "*/.git/*",
  "*/.pixi/*",
  "*/__pycache__/*",
  "*/CLI Coding/*",
  "*/docs/*",
  "*/node_modules/*",
  "*/Screenshots/*",
  "*/tests/*",
  "*/tools/*",
  "*/vendor/*",
]
run.source = ["src/intellicrack"]
report.exclude_lines = [
  "@(abc\\.)?abstractmethod",
  "def __repr__",
  "if __name__ == .__main__.:",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
]
report.fail_under = 80
report.precision = 2
report.show_missing = true
report.skip_covered = false
report.sort = "Cover"
html.directory = "coverage_html_report"
html.title = "Intellicrack Coverage Report"

