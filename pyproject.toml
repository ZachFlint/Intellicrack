[build-system]
requires = ["setuptools>=80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Intellicrack"
version = "1.0.0"
authors = [{ name = "Zachary Flint", email = "zach.flint2@gmail.com" }]
description = "Intellicrack: AI-powered reverse engineering orchestration platform"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
keywords = [
    "reverse-engineering",
    "binary-analysis",
    "ai-orchestration",
    "security-research",
    "frida",
    "ghidra",
    "radare2",
    "x64dbg",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Debuggers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "networkx>=3.6.1,<4",
    "markdown-it-py>=3.0,<4",
    "anthropic",
    "openai",
    "google-genai",
    "ollama",
    "httpx",
    "PyQt6",
    "qdarkstyle",
    "pygments",
    "pefile",
    "lief",
    "capstone",
    "keystone-engine",
    "frida",
    "frida-tools",
    "r2pipe",
    "ghidra-bridge",
    "python-dotenv",
    "tomli",
    "tomli-w",
    "aiofiles",
    "aiosqlite",
    "pydantic",
    "psutil",
    "mcp>=1.26.0",
    "pyannotate>=1.2.0,<2",
    "structlog>=24.1.0",
    "transformers>=5.0.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece",
    "safetensors",
]

[project.optional-dependencies]
dev = [
    "build",
    "pyclean",
    "black",
    "pylint",
    "autopep8",
    "flake8",
    "ruff",
    "isort",
    "pycodestyle",
    "bandit",
    "blinter",
    "vulture",
    "pyupgrade",
    "pydocstyle",
    "sourcery",
    "wemake-python-styleguide",
    "darglint",
    "pyroma",
    "mypy-extensions",
    "dead",
    "uncalled",
    "deadcode",
    "pygount",
    "pytest-deadfixtures",
    "basedpyright",
    "monkeytype",
    "ty",
    "mccabe",
    "xenon",
    "safety",
    "yamllint",
    "jsonlint",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-timeout",
    "pytest-qt",
    "pytest-benchmark",
    "pytest-html",
    "pytest-randomly",
    "pytest-sugar",
    "pytest-env",
    "pytest-instafail",
    "hypothesis",
    "tox",
    "nox",
    "coverage",
    "freezegun",
    "responses",
    "faker",
    "radon",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-tabs",
    "sphinxcontrib-mermaid",
    "sphinx-autobuild",
    "pdoc3",
    "mkdocs-material",
    "pymdown-extensions",
    "myst-parser",
    "ipdb",
    "line-profiler",
    "memory-profiler",
    "py-spy",
    "snakeviz",
    "pyinstrument",
    "scalene",
    "pre-commit",
    "commitizen",
    "bumpversion",
    "pipdeptree",
    "rope",
    "astor",
    "yapf",
    "pip-audit",
    "nodeenv",
    "twine",
    "setuptools-scm",
    "poetry",
    "pycallgraph2",
    "pre-commit-hooks",
    "detect-secrets",
]

[project.urls]
Homepage = "https://github.com/zacharyflint/intellicrack"
"Bug Tracker" = "https://github.com/zacharyflint/intellicrack/issues"
Documentation = "https://intellicrack.readthedocs.io"
"Source Code" = "https://github.com/zacharyflint/intellicrack"

[project.scripts]
intellicrack = "intellicrack.main:main"

[project.gui-scripts]
intellicrack-gui = "intellicrack.main:main"

[tool.pixi.workspace]
name = "Intellicrack"
version = "1.0.0"
description = "Intellicrack: AI-powered reverse engineering orchestration platform"
authors = ["Zachary Flint <zach.flint2@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
python = "3.13.*"
git = "*"
pip = "*"
wheel = "*"
setuptools = "*"
just = "*"
networkx = ">=3.6.1,<4"
shellcheck = "*"
nodejs = "*"
yarn = "*"
markdownlint-cli = "*"
pixi-pycharm = "*"
anyio = "*"
types-requests = "*"
types-pyyaml = "*"
pytest = "*"
rich = "*"
mypy = "*"
markdown-it-py = ">=3.0,<4"

[tool.pixi.pypi-dependencies]
intellicrack = { path = ".", editable = true }
anthropic = "*"
openai = "*"
google-genai = "*"
ollama = "*"
httpx = "*"
PyQt6 = "*"
qdarkstyle = "*"
pygments = "*"
pefile = "*"
lief = "*"
capstone = "*"
keystone-engine = "*"
frida = "*"
frida-tools = "*"
r2pipe = "*"
ghidra-bridge = "*"
python-dotenv = "*"
tomli = "*"
tomli-w = "*"
aiofiles = "*"
aiosqlite = "*"
pydantic = "*"
build = "*"
pyclean = "*"
black = "*"
pylint = "*"
autopep8 = "*"
flake8 = "*"
ruff = "*"
isort = "*"
pycodestyle = "*"
bandit = "*"
blinter = "*"
vulture = "*"
pyupgrade = "*"
pydocstyle = "*"
sourcery = "*"
wemake-python-styleguide = "*"
darglint = "*"
pyroma = "*"
mypy-extensions = "*"
dead = "*"
uncalled = "*"
deadcode = "*"
pygount = "*"
pytest-deadfixtures = "*"
basedpyright = "*"
monkeytype = "*"
ty = "*"
mccabe = "*"
xenon = "*"
safety = "*"
yamllint = "*"
jsonlint = "*"
pytest-cov = "*"
pytest-mock = "*"
pytest-asyncio = "*"
pytest-xdist = "*"
pytest-timeout = "*"
pytest-qt = "*"
pytest-benchmark = "*"
pytest-html = "*"
pytest-randomly = "*"
pytest-sugar = "*"
pytest-env = "*"
pytest-instafail = "*"
hypothesis = "*"
tox = "*"
nox = "*"
coverage = "*"
freezegun = "*"
responses = "*"
faker = "*"
radon = "*"
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-autodoc-typehints = "*"
sphinx-copybutton = "*"
sphinx-tabs = "*"
sphinxcontrib-mermaid = "*"
sphinx-autobuild = "*"
pdoc3 = "*"
mkdocs-material = "*"
pymdown-extensions = "*"
myst-parser = "*"
ipdb = "*"
line-profiler = "*"
memory-profiler = "*"
py-spy = "*"
snakeviz = "*"
pyinstrument = "*"
scalene = "*"
pre-commit = "*"
commitizen = "*"
bumpversion = "*"
pipdeptree = "*"
rope = "*"
astor = "*"
yapf = "*"
pip-audit = "*"
nodeenv = "*"
twine = "*"
setuptools-scm = "*"
poetry = "*"
pycallgraph2 = "*"
pre-commit-hooks = "*"
detect-secrets = "*"
mcp = ">=1.26.0"
pyannotate = ">=1.2.0,<2"
structlog = ">=24.1.0"
transformers = ">=5.0.0"
accelerate = ">=0.30.0"
bitsandbytes = ">=0.43.0"
sentencepiece = "*"
safetensors = "*"

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/xpu"]
index-strategy = "unsafe-best-match"

[tool.pixi.tasks]
dev = "python -m intellicrack"
gui = "python -m intellicrack.ui.app"
test = "just test"
lint = "just lint"
format = "just ruff-fmt"
typecheck = "just basedpyright"
pyright = "basedpyright"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["intellicrack", "intellicrack.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: Slow running tests",
    "integration: Integration tests",
    "unit: Unit tests",
    "xpu: Tests requiring Intel XPU hardware",
    "b580: Tests specific to Intel Arc B580 GPU",
]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.github
  | \.pixi
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.vscode
  | \.idea
  | \.claude
  | \.serena
  | build
  | dist
  | tools
  | docs
  | node_modules
  | CLI\ Coding
  | Screenshots
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.13"
mypy_path = [".", "stubs"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
strict = true
exclude = [
    "^tools/",
    "^build/",
    "^dist/",
    "^\\.git/",
    "^\\.github/",
    "^\\.pixi/",
    "^docs/",
    "^\\.mypy_cache/",
    "^\\.pytest_cache/",
    "^\\.ruff_cache/",
    "^\\.claude/",
    "^\\.serena/",
    "^\\.idea/",
    "^\\.vscode/",
    "^node_modules/",
    "^CLI Coding/",
    "^Screenshots/",
]

[[tool.mypy.overrides]]
module = [
    "frida.*",
    "r2pipe.*",
    "ghidra_bridge.*",
    "pefile.*",
    "lief.*",
    "transformers.*",
    "accelerate.*",
    "bitsandbytes.*",
    "PyQt6.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "intellicrack.ui.*",
]
disable_error_code = ["attr-defined", "misc", "no-any-return", "redundant-cast", "unused-ignore"]

[tool.basedpyright]
include = ["src/intellicrack"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    "**/build",
    "**/dist",
    "**/.git",
    "**/.github",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.claude",
    "**/.serena",
    "**/.idea",
    "**/.vscode",
    "tools",
    "docs",
    ".pixi",
    "CLI Coding",
    "Screenshots",
]
typeCheckingMode = "strict"
pythonVersion = "3.13"
pythonPlatform = "Windows"
useLibraryCodeForTypes = false
analyzeUnannotatedFunctions = true
enableTypeIgnoreComments = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportMissingModuleSource = "warning"
reportUndefinedVariable = "error"
reportGeneralTypeIssues = "error"
extraPaths = ["d:/intellicrack/src"]

[tool.ruff]
line-length = 140
target-version = "py313"
preview = true
src = ["."]
exclude = [
    "tests/",
    ".git/",
    ".github/",
    ".venv/",
    ".pixi/",
    "build/",
    "dist/",
    "*.egg-info/",
    "__pycache__/",
    ".vscode/",
    ".idea/",
    "docs/",
    "tools/",
    ".ruff_cache/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".claude/",
    ".serena/",
    "node_modules/",
    "CLI Coding/",
    "Screenshots/",
    "typings/",
    "stubs/",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C9",   # mccabe complexity
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "ICN",  # flake8-import-conventions
    "T20",  # flake8-print
    "ARG",  # flake8-unused-arguments
    "G",    # flake8-logging-format
    "TC",   # flake8-type-checking
    "RET",  # flake8-return
    "PL",   # pylint
    "TRY",  # tryceratops
    "RUF",  # ruff-specific
    "PERF", # perflint
    "D",    # pydocstyle
    "S",    # bandit security
]

unfixable = [
    "TRY400",
    "RUF013",
    "RUF022",
    "RET503",
]

ignore = [
    "E501",    # line-too-long
    "D203",    # incorrect-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "S603",    # subprocess-without-shell-equals-true
    "S607",    # partial-path
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR1702", # too-many-nested-blocks
]

fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S102", "S404"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 25
max-statements = 100
max-public-methods = 50

[tool.ruff.lint.isort]
lines-after-imports = 2
force-wrap-aliases = true
combine-as-imports = true
known-first-party = ["intellicrack"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.bandit]
exclude_dirs = ["tests", "docs", "tools", ".git", ".github", ".pixi", "node_modules", "CLI Coding", "Screenshots"]
skips = ["B101", "B601"]

[tool.coverage.run]
source = ["src/intellicrack"]
omit = ["*/.git/*", "*/.pixi/*", "*/tests/*", "*/docs/*", "*/__pycache__/*", "*/tools/*", "*/node_modules/*", "*/CLI Coding/*", "*/Screenshots/*"]
branch = true

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"
title = "Intellicrack Coverage Report"