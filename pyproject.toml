accelerate = ">=1.13.0, <2"
bitsandbytes = ">=0.49.2, <0.50"
sentencepiece = ">=0.2.1, <0.3"
safetensors = ">=0.7.0, <0.8"
# Dev tools (unbounded - float to latest)
validate-pyproject = ">=0.25, <0.26"
types-requests = ">=2.32.4.20260107, <3"
types-pyyaml = ">=6.0.12.20250915, <7"
