[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.27" ]

[project]
name = "intellicrack"
version = "0.1.0a1"
description = "Intellicrack: AI-powered reverse engineering orchestration platform"
readme = "README.md"
keywords = [
  "ai-orchestration",
  "binary-analysis",
  "cutter",
  "frida",
  "ghidra",
  "reverse-engineering",
  "rizin",
  "security-research",
  "x64dbg",
]
license = "GPL-3.0-or-later"
authors = [ { name = "Zachary Flint", email = "zach.flint2@gmail.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Disassemblers",
  "Typing :: Typed",
]
dependencies = [
  "anthropic",
  "capstone",
  "frida",
  "google-genai",
  "httpx",
  "keyring>=25.7,<26",
  "keystone-engine",
  "lief",
  "openai",
  "pefile",
  "psutil>=7.2.2,<8",
  "PyQt6",
  "r2pipe",
  "structlog",
  "xxhash",
  "yara-python>=4.5.4,<5",
]
optional-dependencies.dev = [
  "astor",
  "autopep8",
  "bandit",
  "basedpyright",
  "black",
  "blinter",
  "build",
  "bumpversion",
  "check-wheel-contents",
  "codespell",
  "commitizen",
  "darglint",
  "dead",
  "deadcode",
  "deptry",
  "detect-secrets",
  "docformatter",
  "flake8",
  "flake8-pyproject",
  "interrogate",
  "isort",
  "jsonlint",
  "mccabe",
  "monkeytype",
  "mypy",
  "mypy-extensions",
  "nodeenv",
  "pip-audit",
  "pipdeptree",
  "poetry",
  "pre-commit",
  "pre-commit-hooks",
  "pyannotate",
  "pyclean",
  "pycodestyle",
  "pydoclint",
  "pydocstyle",
  "pygount",
  "pylint",
  "pyproject-fmt",
  "pyroma",
  "pyupgrade",
  "radon",
  "rope",
  "ruff",
  "safety",
  "sourcery",
  "twine",
  "ty",
  "types-pyyaml",
  "types-requests",
  "uncalled",
  "validate-pyproject",
  "validate-pyproject-schema-store",
  "vermin",
  "vulture",
  "wemake-python-styleguide",
  "wily",
  "xenon",
  "yamllint",
  "yapf",
]
optional-dependencies.docs = [
  "mkdocs-material",
  "myst-parser",
  "pdoc3",
  "pymdown-extensions",
  "sphinx",
  "sphinx-autobuild",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-rtd-theme",
  "sphinx-tabs",
  "sphinxcontrib-mermaid",
]
optional-dependencies.ml = [
  "accelerate",
  "bitsandbytes",
  "safetensors",
  "sentencepiece",
  "torch",
  "transformers",
]
optional-dependencies.profile = [
  "ipdb",
  "line-profiler",
  "memory-profiler",
  "py-spy",
  "pycallgraph2",
  "pyinstrument",
  "scalene",
  "snakeviz",
]
optional-dependencies.test = [
  "coverage",
  "faker",
  "freezegun",
  "hypothesis",
  "nox",
  "pytest",
  "pytest-asyncio",
  "pytest-benchmark",
  "pytest-cov",
  "pytest-deadfixtures",
  "pytest-env",
  "pytest-html",
  "pytest-instafail",
  "pytest-mock",
  "pytest-qt",
  "pytest-randomly",
  "pytest-sugar",
  "pytest-timeout",
  "pytest-xdist",
  "responses",
  "tox",
]
urls."Bug Tracker" = "https://github.com/zacharyflint/intellicrack/issues"
urls."Source Code" = "https://github.com/zacharyflint/intellicrack"
urls.Documentation = "https://intellicrack.readthedocs.io"
urls.Homepage = "https://github.com/zacharyflint/intellicrack"
scripts.intellicrack = "intellicrack.main:main"
gui-scripts.intellicrack-gui = "intellicrack.main:main"

[tool.hatch]
build.targets.wheel.packages = [ "src/intellicrack" ]

[tool.black]
line-length = 100
target-version = [ "py313" ]
include = "\\.pyi?$"
extend-exclude = '''/(
  \.git
  | \.github
  | \.pixi
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.vscode
  | \.idea
  | \.claude
  | \.serena
  | build
  | dist
  | tools
  | docs
  | node_modules
  | CLI\ Coding
  | Screenshots
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 140
src = [ "." ]
exclude = [
  "*.egg-info/",
  ".claude/",
  ".git/",
  ".github/",
  ".idea/",
  ".mypy_cache/",
  ".pixi/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".serena/",
  ".venv/",
  ".vscode/",
  "__pycache__/",
  "build/",
  "CLI Coding/",
  "dist/",
  "docs/",
  "node_modules/",
  "Screenshots/",
  "stubs/",
  "tests/",
  "tools/",
  "typings/",
  "vendor/",
  "vulture_whitelist.py",
]
force-exclude = true
preview = true
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-format = true
lint.select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "C90",   # mccabe complexity
  "COM",   # flake8-commas
  "CPY",   # flake8-copyright
  "D",     # pydocstyle
  "DOC",   # pydoclint
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle errors
  "EM",    # flake8-errmsg
  "ERA",   # eradicate (commented-out code)
  "F",     # pyflakes
  "FBT",   # flake8-boolean-trap
  "FIX",   # flake8-fixme (TODO/FIXME)
  "FLY",   # flynt (f-string conversion)
  "FURB",  # refurb (code modernization)
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # perflint
  "PGH",   # pygrep-hooks
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi (stub files)
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff-specific
  "S",     # bandit security
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
lint.ignore = [
  "D107",    # missing-docstring-in-__init__ (conflicts with pydoclint DOC301)
  "D203",    # incorrect-blank-line-before-class
  "D213",    # multi-line-summary-second-line
  "E501",    # line-too-long
  "PLR0911", # too-many-return-statements
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0915", # too-many-statements
  "PLR1702", # too-many-nested-blocks
  "S603",    # subprocess-without-shell-equals-true
  "S607",    # partial-path
]
lint.per-file-ignores.".claude/**" = [ "S404" ]
lint.per-file-ignores."scripts/**" = [ "S404", "S603", "T201" ]
lint.per-file-ignores."src/intellicrack/bridges/ghidra.py" = [ "PLR0904" ]
lint.per-file-ignores."src/intellicrack/bridges/hex_editor.py" = [ "PLR0904" ]
lint.per-file-ignores."src/intellicrack/bridges/x64dbg.py" = [ "PLR0904" ]
lint.per-file-ignores."src/intellicrack/core/hexpat/ast_nodes.py" = [ "UP040" ]
lint.per-file-ignores."src/intellicrack/core/hexpat/evaluator.py" = [
  "C901",
  "PLR0914",
  "PLR2004",
  "TRY003",
]
lint.per-file-ignores."src/intellicrack/core/hexpat/interpreter.py" = [ "PLC0415" ]
lint.per-file-ignores."src/intellicrack/core/hexpat/lexer.py" = [ "C901" ]
lint.per-file-ignores."src/intellicrack/core/hexpat/parser.py" = [ "C901", "PLR0914" ]
lint.per-file-ignores."src/intellicrack/core/hexpat/pattern_registry.py" = [ "TC003" ]
lint.per-file-ignores."src/intellicrack/core/hexpat/preprocessor.py" = [ "PLR0914", "TC003" ]
lint.per-file-ignores."src/intellicrack/core/hexpat/stdlib.py" = [ "PLR2004", "TRY003" ]
lint.per-file-ignores."src/intellicrack/core/tools.py" = [ "PLC0415" ]
lint.per-file-ignores."src/intellicrack/main.py" = [ "PLC0415" ]
lint.per-file-ignores."src/intellicrack/ui/app.py" = [ "PLC0415" ]
lint.per-file-ignores."src/intellicrack/ui/panels/async_bridge.py" = [ "UP047" ]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor/_disassembly.py" = [ "PLR0914" ]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor/_search.py" = [ "PLR0914" ]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor/_widgets.py" = [ "N802" ]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor/panel.py" = [ "PLR0914" ]
lint.per-file-ignores."src/intellicrack/ui/panels/hex_editor_panel.py" = [
  "N802",
  "PLR0914",
  "S324",
]
lint.per-file-ignores."src/intellicrack/ui/tools.py" = [ "PLR0904" ]
lint.per-file-ignores."tests/**" = [ "B009", "PLR2004", "PLR6301", "S101", "S102", "S404" ]
lint.fixable = [ "ALL" ]
lint.unfixable = [ "PTH123", "RET503", "RUF013", "RUF022", "TID252", "TRY400" ]
lint.dummy-variable-rgx = "^(_+|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [ "intellicrack" ]
lint.isort.lines-after-imports = 2
lint.mccabe.max-complexity = 30
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 20
lint.pylint.max-branches = 25
lint.pylint.max-public-methods = 50
lint.pylint.max-statements = 100

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 140
exclude = [
  ".git",
  ".github",
  ".pixi",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".vscode",
  ".idea",
  ".claude",
  ".serena",
  "build",
  "dist",
  "tools",
  "docs",
  "node_modules",
  "CLI Coding",
  "Screenshots",
  "typings",
  "stubs",
]
extend-ignore = [
  "E203",
  "W503",
  "WPS110",
  "WPS111",
  "WPS114",
  "WPS115",
  "WPS122",
  "WPS201",
  "WPS202",
  "WPS204",
  "WPS210",
  "WPS213",
  "WPS214",
  "WPS220",
  "WPS221",
  "WPS226",
  "WPS229",
  "WPS231",
  "WPS232",
  "WPS235",
  "WPS237",
  "WPS238",
  "WPS300",
  "WPS301",
  "WPS332",
  "WPS336",
  "WPS338",
  "WPS339",
  "WPS356",
  "WPS358",
  "WPS407",
  "WPS410",
  "WPS412",
  "WPS420",
  "WPS430",
  "WPS432",
  "WPS462",
  "WPS476",
  "WPS501",
  "WPS504",
  "WPS505",
  "WPS529",
  "WPS602",
  "WPS615",
]
per-file-ignores = [ "tests/*:S101,S102,S404" ]

[tool.codespell]
skip = """\
  .git,.github,.pixi,build,dist,tools,node_modules,CLI \
  Coding,Screenshots,typings,stubs,*.lock,reports,*.egg-info,*.hta,*.hpp,*.graphml\
  """
ignore-words-list = "lief,crossreference,thirdparty,nd,lod,connin,regist"
count = true

[tool.docformatter]
wrap-summaries = 140
wrap-descriptions = 140
pre-summary-newline = false
close-quotes-on-newline = true
recursive = true
exclude = [
  ".git",
  ".pixi",
  "build",
  "dist",
  "node_modules",
  "tools",
  "vendor",
  "typings",
  "stubs",
]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = true
check-yield-types = true

[tool.deptry]
known_first_party = [ "intellicrack" ]
pep621_dev_dependency_groups = [ "dev", "test", "docs", "profile" ]
extend_exclude = [
  "tests",
  "docs",
  "tools",
  "scripts",
  "vendor",
  ".git",
  ".github",
  ".pixi",
  ".claude",
  "build",
  "dist",
  "node_modules",
  "CLI Coding",
  "Screenshots",
  "typings",
  "stubs",
]
per_rule_ignores = { DEP002 = [
  "accelerate",
  "bitsandbytes",
  "sentencepiece",
  "safetensors",
  "ghidra-bridge",
  "tomli-w",
], DEP003 = [
  "intellicrack_hexcore",
] }
package_module_name_map.keystone-engine = [ "keystone" ]
package_module_name_map.google-genai = [ "google" ]
package_module_name_map.ghidra-bridge = [ "ghidra_bridge" ]
package_module_name_map.tomli-w = [ "tomli_w" ]

[tool.bandit]
exclude_dirs = [
  "tests",
  "docs",
  "tools",
  ".git",
  ".github",
  ".pixi",
  "node_modules",
  "CLI Coding",
  "Screenshots",
]
skips = [ "B101", "B601" ]

[tool.mypy]
python_version = "3.13"
mypy_path = [ ".", "stubs" ]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
strict = true
exclude = [
  "^tools/",
  "^build/",
  "^dist/",
  "^\\.git/",
  "^\\.github/",
  "^\\.pixi/",
  "^docs/",
  "^\\.mypy_cache/",
  "^\\.pytest_cache/",
  "^\\.ruff_cache/",
  "^\\.claude/",
  "^\\.serena/",
  "^\\.idea/",
  "^\\.vscode/",
  "^node_modules/",
  "^CLI Coding/",
  "^Screenshots/",
]

[[tool.mypy.overrides]]
module = [
  "frida.*",
  "r2pipe.*",
  "ghidra_bridge.*",
  "pefile.*",
  "lief.*",
  "transformers.*",
  "accelerate.*",
  "bitsandbytes.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [ "intellicrack.ui.*" ]
disable_error_code = [ "attr-defined", "misc", "no-any-return", "redundant-cast", "unused-ignore" ]

[tool.pytest]
ini_options.minversion = "8.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "-ra", "--strict-markers" ]
ini_options.python_files = [ "test_*.py", "*_test.py" ]
ini_options.python_classes = [ "Test*" ]
ini_options.python_functions = [ "test_*" ]
ini_options.markers = [
  "slow: Slow running tests",
  "integration: Integration tests",
  "unit: Unit tests",
  "xpu: Tests requiring Intel XPU hardware",
  "b580: Tests specific to Intel Arc B580 GPU",
]

[tool.coverage]
run.branch = true
run.omit = [
  "*/.git/*",
  "*/.pixi/*",
  "*/__pycache__/*",
  "*/CLI Coding/*",
  "*/docs/*",
  "*/node_modules/*",
  "*/Screenshots/*",
  "*/tests/*",
  "*/tools/*",
]
run.source = [ "src/intellicrack" ]
report.exclude_lines = [
  "@(abc\\.)?abstractmethod",
  "def __repr__",
  "if __name__ == .__main__.:",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
]
report.fail_under = 80
report.precision = 2
report.show_missing = true
report.skip_covered = false
report.sort = "Cover"
html.directory = "coverage_html_report"
html.title = "Intellicrack Coverage Report"

[tool.basedpyright]
include = [ "src/intellicrack" ]
exclude = [
  "**/__pycache__",
  "**/node_modules",
  "**/.venv",
  "**/build",
  "**/dist",
  "**/.git",
  "**/.github",
  "**/.pytest_cache",
  "**/.mypy_cache",
  "**/.ruff_cache",
  "**/.claude",
  "**/.serena",
  "**/.idea",
  "**/.vscode",
  "tools",
  "docs",
  ".pixi",
  "CLI Coding",
  "Screenshots",
]
typeCheckingMode = "strict"
pythonVersion = "3.13"
pythonPlatform = "Windows"
useLibraryCodeForTypes = false
analyzeUnannotatedFunctions = true
enableTypeIgnoreComments = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportMissingModuleSource = "warning"
reportUndefinedVariable = "error"
reportGeneralTypeIssues = "error"
extraPaths = [ "src" ]

[tool.vulture]
min_confidence = 80
ignore_decorators = [
  "@abstractmethod",
  "@abc.abstractmethod",
  "@property",
  "@*.setter",
  "@staticmethod",
  "@classmethod",
  "@override",
]
ignore_names = [
  "argtypes",
  "restype",
  "supports_*",
  "visit_*",
  "do_*",
  "test_*",
  "setUp",
  "tearDown",
  "setUpClass",
  "tearDownClass",
]
exclude = [
  ".git/",
  ".github/",
  ".pixi/",
  "build/",
  "dist/",
  "tools/",
  "docs/",
  "node_modules/",
  "CLI Coding/",
  "Screenshots/",
  "typings/",
  "stubs/",
]

[tool.deadcode]
exclude = [ "tests", "tools", "docs", ".git", ".pixi", "node_modules", "CLI Coding", "Screenshots" ]
ignore-names = [
  "argtypes",
  "restype",
  "supports_*",
  "test_*",
  "setUp",
  "tearDown",
  "setUpClass",
  "tearDownClass",
  "paintEvent",
  "mouseMoveEvent",
  "mouseReleaseEvent",
  "keyReleaseEvent",
  "wheelEvent",
  "contextMenuEvent",
  "highlightBlock",
  "sizeHint",
  "do_GET",
  "log_request",
  "row_factory",
  "allow_reuse_address",
  "propagate",
  "__getattr__",
  "_fields_",
  "_asm_highlighter",
  "_c_highlighter",
  "_cutter_bridge",
  "_ghidra_bridge",
  "_decompile_btn",
  "_graph_btn",
  "_refresh_devices_btn",
  "_find_next_btn",
  "_find_prev_btn",
  "_undo_btn",
  "_redo_btn",
  "matched_bytes",
  "selection",
  "rflags",
  "thinking_content",
  "signature",
  "classification_block_size",
  "is_const",
  "started_at",
  "environment_variables",
  "loaded_families",
  "code_font_family",
  "ui_font_family",
  "current_theme",
  "scan_data_async",
  "scan_file_async",
  "OAuthFlowType",
  "authorize_google",
  "get_process_bridge",
  "get_sandbox_bridge",
  "add_highlight_rule",
  "remove_highlight_rule",
  "list_hexpat_patterns",
  "clear_selection",
  "filter",
  "needs_refresh",
  "display_type",
  "has_code",
  "is_executable",
  "is_readable",
  "is_writable",
  "hex_state_available",
  "transform_pipeline_available",
  "DISPLAY_MODES",
  "ASYNC_SUBPROCESS",
  "AUTHORIZATION_CODE",
  "DEFAULT_CODE_FONT",
  "WIN_PAGE_EXECUTE_READWRITE",
  "MAX_LOCAL_VARS",
  "use_flash_attention",
  "quantization_config",
  "_config_dir",
  "preview",
  "get_structlog_logger",
  "connect_hex_widget_to_tools",
  "execute_pattern_bytes",
  "load_template",
]
ignore-definitions-if-decorated-with = [
  "abstractmethod",
  "abc.abstractmethod",
  "property",
  "staticmethod",
  "classmethod",
  "override",
]
ignore-definitions-if-inherits-from = [
  "ToolBridgeBase",
  "StaticAnalysisBridge",
  "DynamicAnalysisBridge",
  "BinaryOperationsBridge",
  "DebuggerBridge",
  "InstrumentationBridge",
  "LLMProviderBase",
  "SandboxBase",
  "HexDocumentState",
  "QWidget",
  "QDialog",
  "QMainWindow",
  "QSyntaxHighlighter",
  "Protocol",
  "TypedDict",
  "ABC",
  "abc.ABC",
]
ignore-names-if-inherits-from = [
  "ToolBridgeBase",
  "StaticAnalysisBridge",
  "DynamicAnalysisBridge",
  "BinaryOperationsBridge",
  "DebuggerBridge",
  "InstrumentationBridge",
  "LLMProviderBase",
  "SandboxBase",
  "HexDocumentState",
  "QWidget",
  "QDialog",
  "QMainWindow",
  "QSyntaxHighlighter",
  "Protocol",
  "TypedDict",
  "ABC",
  "abc.ABC",
]

[tool.interrogate]
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 0
style = "google"
verbose = 2
exclude = [
  "tests",
  "docs",
  "tools",
  ".git",
  ".github",
  ".pixi",
  "build",
  "dist",
  "node_modules",
  "CLI Coding",
  "Screenshots",
  "typings",
  "stubs",
]

