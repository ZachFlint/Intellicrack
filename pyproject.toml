twine = ">=6.2.0, <7"
setuptools-scm = ">=9.2.2, <10"
poetry = ">=2.3.2, <3"
pycallgraph2 = ">=1.1.3, <2"
pre-commit-hooks = ">=6.0.0, <7"
detect-secrets = ">=1.5.0, <2"
mcp = ">=1.26.0, <2"
pyannotate = ">=1.2.0, <2"
structlog = ">=25.5.0, <26"
transformers = ">=5.1.0, <6"
accelerate = ">=1.12.0, <2"
bitsandbytes = ">=0.49.1, <0.50"
sentencepiece = ">=0.2.1, <0.3"
safetensors = ">=0.7.0, <0.8"

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/xpu"]
index-strategy = "unsafe-best-match"

[tool.pixi.tasks]
dev = "python -m intellicrack"
gui = "python -m intellicrack.ui.app"
test = "just test"
lint = "just lint"
format = "just ruff-fmt"
typecheck = "just basedpyright"
pyright = "basedpyright"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["intellicrack", "intellicrack.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: Slow running tests",
    "integration: Integration tests",
    "unit: Unit tests",
    "xpu: Tests requiring Intel XPU hardware",
    "b580: Tests specific to Intel Arc B580 GPU",
]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.github
  | \.pixi
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.vscode
  | \.idea
  | \.claude
  | \.serena
  | build
  | dist
  | tools
  | docs
  | node_modules
  | CLI\ Coding
  | Screenshots
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.13"
mypy_path = [".", "stubs"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
strict = true
exclude = [
    "^tools/",
    "^build/",
    "^dist/",
    "^\\.git/",
    "^\\.github/",
    "^\\.pixi/",
    "^docs/",
    "^\\.mypy_cache/",
    "^\\.pytest_cache/",
    "^\\.ruff_cache/",
    "^\\.claude/",
    "^\\.serena/",
    "^\\.idea/",
    "^\\.vscode/",
    "^node_modules/",
    "^CLI Coding/",
    "^Screenshots/",
]

[[tool.mypy.overrides]]
module = [
    "frida.*",
    "r2pipe.*",
    "ghidra_bridge.*",
    "pefile.*",
    "lief.*",
    "transformers.*",
    "accelerate.*",
    "bitsandbytes.*",
    "PyQt6.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "intellicrack.ui.*",
]
disable_error_code = ["attr-defined", "misc", "no-any-return", "redundant-cast", "unused-ignore"]

[tool.basedpyright]
include = ["src/intellicrack"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    "**/build",
    "**/dist",
    "**/.git",
    "**/.github",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.claude",
    "**/.serena",
    "**/.idea",
    "**/.vscode",
    "tools",
    "docs",
    ".pixi",
    "CLI Coding",
    "Screenshots",
]
typeCheckingMode = "strict"
pythonVersion = "3.13"
pythonPlatform = "Windows"
useLibraryCodeForTypes = false
analyzeUnannotatedFunctions = true
enableTypeIgnoreComments = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportMissingModuleSource = "warning"
reportUndefinedVariable = "error"
reportGeneralTypeIssues = "error"
extraPaths = ["d:/intellicrack/src"]

[tool.ruff]
line-length = 140
target-version = "py313"
preview = true
src = ["."]
exclude = [
    "tests/",
    ".git/",
    ".github/",
    ".venv/",
    ".pixi/",
    "build/",
    "dist/",
    "*.egg-info/",
    "__pycache__/",
    ".vscode/",
    ".idea/",
    "docs/",
    "tools/",
    ".ruff_cache/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".claude/",
    ".serena/",
    "node_modules/",
    "CLI Coding/",
    "Screenshots/",
    "typings/",
    "stubs/",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C9",   # mccabe complexity
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "ICN",  # flake8-import-conventions
    "T20",  # flake8-print
    "ARG",  # flake8-unused-arguments
    "G",    # flake8-logging-format
    "TC",   # flake8-type-checking
    "RET",  # flake8-return
    "PL",   # pylint
    "TRY",  # tryceratops
    "RUF",  # ruff-specific
    "PERF", # perflint
    "D",    # pydocstyle
    "S",    # bandit security
]

unfixable = [
    "TRY400",
    "RUF013",
    "RUF022",
    "RET503",
]

ignore = [
    "E501",    # line-too-long
    "D203",    # incorrect-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "S603",    # subprocess-without-shell-equals-true
    "S607",    # partial-path
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR1702", # too-many-nested-blocks
]

fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S102", "S404"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 25
max-statements = 100
max-public-methods = 50

[tool.ruff.lint.isort]
lines-after-imports = 2
force-wrap-aliases = true
combine-as-imports = true
known-first-party = ["intellicrack"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.flake8]
max-line-length = 140
exclude = [
    ".git",
    ".github",
    ".pixi",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    ".idea",
    ".claude",
    ".serena",
    "build",
    "dist",
    "tools",
    "docs",
    "node_modules",
    "CLI Coding",
    "Screenshots",
    "typings",
    "stubs",
]
extend-ignore = ["E203", "W503"]
per-file-ignores = ["tests/*:S101,S102,S404"]

[tool.bandit]
exclude_dirs = ["tests", "docs", "tools", ".git", ".github", ".pixi", "node_modules", "CLI Coding", "Screenshots"]
skips = ["B101", "B601"]

[tool.coverage.run]
source = ["src/intellicrack"]
omit = ["*/.git/*", "*/.pixi/*", "*/tests/*", "*/docs/*", "*/__pycache__/*", "*/tools/*", "*/node_modules/*", "*/CLI Coding/*", "*/Screenshots/*"]
branch = true

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"
title = "Intellicrack Coverage Report"

[tool.vulture]
min_confidence = 80
ignore_decorators = [
    "@abstractmethod",
    "@abc.abstractmethod",
    "@property",
    "@*.setter",
    "@staticmethod",
    "@classmethod",
    "@override",
]
ignore_names = [
    "argtypes",
    "restype",
    "supports_*",
    "visit_*",
    "do_*",
    "test_*",
    "setUp",
    "tearDown",
    "setUpClass",
    "tearDownClass",
]
exclude = [
    ".git/",
    ".github/",
    ".pixi/",
    "build/",
    "dist/",
    "tools/",
    "docs/",
    "node_modules/",
    "CLI Coding/",
    "Screenshots/",
    "typings/",
    "stubs/",
]

[tool.deadcode]
exclude = ["tests", "tools", "docs", ".git", ".pixi", "node_modules", "CLI Coding", "Screenshots"]
ignore-names = [
    "argtypes",
    "restype",
    "supports_*",
    "test_*",
    "setUp",
    "tearDown",
    "setUpClass",
    "tearDownClass",
]
ignore-definitions-if-decorated-with = [
    "abstractmethod",
    "abc.abstractmethod",
    "property",
    "staticmethod",
    "classmethod",
    "override",
]
ignore-definitions-if-inherits-from = [
    "ToolBridgeBase",
    "StaticAnalysisBridge",
    "DynamicAnalysisBridge",
    "BinaryOperationsBridge",
    "LLMProviderBase",
    "SandboxBase",
    "ABC",
    "abc.ABC",
]
ignore-names-if-inherits-from = [
    "ToolBridgeBase",
    "StaticAnalysisBridge",
    "DynamicAnalysisBridge",
    "BinaryOperationsBridge",
    "LLMProviderBase",
    "SandboxBase",
    "ABC",
    "abc.ABC",
]
