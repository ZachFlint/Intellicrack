[build-system]
requires = [ "setuptools>=80.10.2", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "Intellicrack"
version = "0.1.0a1"
authors = [ { name = "Zachary Flint", email = "zach.flint2@gmail.com" } ]
description = "Intellicrack: AI-powered reverse engineering orchestration platform"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
keywords = [
  "reverse-engineering",
  "binary-analysis",
  "ai-orchestration",
  "security-research",
  "frida",
  "ghidra",
  "cutter",
  "rizin",
  "x64dbg",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Disassemblers",
  "Typing :: Typed",
]
dependencies = [
  "psutil>=7.2.2,<8",
  "keyring>=25.7.0,<26",
  "torch",
  "yara-python>=4.5.4,<5", "black", "pylint", "autopep8", "flake8", "flake8-pyproject", "ruff", "isort", "pycodestyle", "bandit", "blinter", "vulture", "pyupgrade", "pydocstyle", "sourcery", "wemake-python-styleguide", "darglint", "pydoclint", "pyroma", "yapf", "mccabe", "xenon", "codespell", "detect-secrets", "safety", "yamllint", "jsonlint", "interrogate", "deptry", "radon", "dead", "uncalled", "deadcode", "pygount", "basedpyright", "mypy", "mypy-extensions", "monkeytype", "ty", "pyannotate", "types-requests", "types-pyyaml", "build", "pyclean", "pre-commit", "pre-commit-hooks", "commitizen", "bumpversion", "setuptools-scm", "twine", "rope", "astor", "nodeenv", "pipdeptree", "pip-audit", "poetry", "validate-pyproject", "pytest", "pytest-cov", "pytest-mock", "pytest-asyncio", "pytest-xdist", "pytest-timeout", "pytest-qt", "pytest-benchmark", "pytest-html", "pytest-randomly", "pytest-sugar", "pytest-env", "pytest-instafail", "pytest-deadfixtures", "hypothesis", "tox", "nox", "coverage", "freezegun", "responses", "faker", "sphinx", "sphinx-rtd-theme", "sphinx-autodoc-typehints", "sphinx-copybutton", "sphinx-tabs", "sphinxcontrib-mermaid", "sphinx-autobuild", "pdoc3", "mkdocs-material", "pymdown-extensions", "myst-parser", "ipdb", "line-profiler", "memory-profiler", "py-spy", "snakeviz", "pyinstrument", "scalene", "pycallgraph2", "transformers", "accelerate", "bitsandbytes", "sentencepiece", "safetensors",
]

[project.optional-dependencies]
dev = [
  "black",
  "pylint",
  "autopep8",
  "flake8",
  "flake8-pyproject",
  "ruff",
  "isort",
  "pycodestyle",
  "bandit",
  "blinter",
  "vulture",
  "pyupgrade",
  "pydocstyle",
  "sourcery",
  "wemake-python-styleguide",
  "darglint",
  "pydoclint",
  "pyroma",
  "yapf",
  "mccabe",
  "xenon",
  "codespell",
  "detect-secrets",
  "safety",
  "yamllint",
  "jsonlint",
  "interrogate",
  "deptry",
  "radon",
  "dead",
  "uncalled",
  "deadcode",
  "pygount",
  "basedpyright",
  "mypy",
  "mypy-extensions",
  "monkeytype",
  "ty",
  "pyannotate",
  "types-requests",
  "types-pyyaml",
  "build",
  "pyclean",
  "pre-commit",
  "pre-commit-hooks",
  "commitizen",
  "bumpversion",
  "setuptools-scm",
  "twine",
  "rope",
  "astor",
  "nodeenv",
  "pipdeptree",
  "pip-audit",
  "poetry",
  "validate-pyproject",
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pytest-asyncio",
  "pytest-xdist",
  "pytest-timeout",
  "pytest-qt",
  "pytest-benchmark",
  "pytest-html",
  "pytest-randomly",
  "pytest-sugar",
  "pytest-env",
  "pytest-instafail",
  "pytest-deadfixtures",
  "hypothesis",
  "tox",
  "nox",
  "coverage",
  "freezegun",
  "responses",
  "faker",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-mermaid",
  "sphinx-autobuild",
  "pdoc3",
  "mkdocs-material",
  "pymdown-extensions",
  "myst-parser",
]
profile = [
  "ipdb",
  "line-profiler",
  "memory-profiler",
  "py-spy",
  "snakeviz",
  "pyinstrument",
  "scalene",
  "pycallgraph2",
]
ml = [ "torch", "transformers", "accelerate", "bitsandbytes", "sentencepiece", "safetensors" ]

[project.urls]
Homepage = "https://github.com/zacharyflint/intellicrack"
"Bug Tracker" = "https://github.com/zacharyflint/intellicrack/issues"
Documentation = "https://intellicrack.readthedocs.io"
"Source Code" = "https://github.com/zacharyflint/intellicrack"

[project.scripts]
intellicrack = "intellicrack.main:main"

[project.gui-scripts]
intellicrack-gui = "intellicrack.main:main"

[tool.pixi.workspace]
name = "Intellicrack"
version = "0.1.0a1"
description = "Intellicrack: AI-powered reverse engineering orchestration platform"
authors = [ "Zachary Flint <zach.flint2@gmail.com>" ]
channels = [ "conda-forge" ]
platforms = [ "win-64" ]
preview = [ "pixi-build" ]

[tool.pixi.dependencies]
