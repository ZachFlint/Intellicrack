[build-system]
requires = ["setuptools>=80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Intellicrack"
version = "1.0.0"
authors = [{ name = "Zachary Flint", email = "zach.flint2@gmail.com" }]
description = "Intellicrack: AI-powered reverse engineering orchestration platform"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
keywords = [
    "reverse-engineering",
    "binary-analysis",
    "ai-orchestration",
    "security-research",
    "frida",
    "ghidra",
    "radare2",
    "x64dbg",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Debuggers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "networkx",
    "markdown-it-py",
    "psutil", "flake8-pyproject", "pytest", "build", "pyclean", "black", "pylint", "autopep8", "flake8", "ruff", "isort", "pycodestyle", "bandit", "blinter", "vulture", "pyupgrade", "pydocstyle", "sourcery", "wemake-python-styleguide", "darglint", "pyroma", "mypy-extensions", "dead", "uncalled", "deadcode", "pygount", "pytest-deadfixtures", "basedpyright", "monkeytype", "ty", "mccabe", "xenon", "safety", "yamllint", "jsonlint", "pytest-cov", "pytest-mock", "pytest-asyncio", "pytest-xdist", "pytest-timeout", "pytest-qt", "pytest-benchmark", "pytest-html", "pytest-randomly", "pytest-sugar", "pytest-env", "pytest-instafail", "hypothesis", "tox", "nox", "coverage", "freezegun", "responses", "faker", "radon", "sphinx", "sphinx-rtd-theme", "sphinx-autodoc-typehints", "sphinx-copybutton", "sphinx-tabs", "sphinxcontrib-mermaid", "sphinx-autobuild", "pdoc3", "mkdocs-material", "pymdown-extensions", "myst-parser", "ipdb", "line-profiler", "memory-profiler", "py-spy", "snakeviz", "pyinstrument", "scalene", "pre-commit", "commitizen", "bumpversion", "pipdeptree", "rope", "astor", "yapf", "pip-audit", "nodeenv", "twine", "setuptools-scm", "poetry", "pycallgraph2", "pre-commit-hooks", "detect-secrets",
]

[project.optional-dependencies]
dev = [
    "build",
    "pyclean",
    "black",
    "pylint",
    "autopep8",
    "flake8",
    "flake8-pyproject",
    "ruff",
    "isort",
    "pycodestyle",
    "bandit",
    "blinter",
    "vulture",
    "pyupgrade",
    "pydocstyle",
    "sourcery",
    "wemake-python-styleguide",
    "darglint",
    "pyroma",
    "mypy-extensions",
    "dead",
    "uncalled",
    "deadcode",
    "pygount",
    "pytest-deadfixtures",
    "basedpyright",
    "monkeytype",
    "ty",
    "mccabe",
    "xenon",
    "safety",
    "yamllint",
    "jsonlint",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-timeout",
    "pytest-qt",
    "pytest-benchmark",
    "pytest-html",
    "pytest-randomly",
    "pytest-sugar",
    "pytest-env",
    "pytest-instafail",
    "hypothesis",
    "tox",
    "nox",
    "coverage",
    "freezegun",
    "responses",
    "faker",
    "radon",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-tabs",
    "sphinxcontrib-mermaid",
    "sphinx-autobuild",
    "pdoc3",
    "mkdocs-material",
    "pymdown-extensions",
    "myst-parser",
    "ipdb",
    "line-profiler",
    "memory-profiler",
    "py-spy",
    "snakeviz",
    "pyinstrument",
    "scalene",
    "pre-commit",
    "commitizen",
    "bumpversion",
    "pipdeptree",
    "rope",
    "astor",
    "yapf",
    "pip-audit",
    "nodeenv",
    "twine",
    "setuptools-scm",
    "poetry",
    "pycallgraph2",
    "pre-commit-hooks",
