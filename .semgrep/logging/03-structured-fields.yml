rules:
  - id: intellicrack-logging-c1-except-log-missing-error-context
    message: >-
      A log call inside an `except:` block passes no error context. Without `error=str(e)` (or better, using `.exception()` which captures the traceback automatically) the record tells you something went wrong but nothing about WHAT. Either switch to `_logger.exception("event_name", <context kwargs>)` or add `error=str(e), error_type=type(e).__name__`.
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except $E as $X:
                  ...
                  $L.info($EVENT)
          - pattern: |
              try:
                  ...
              except $E as $X:
                  ...
                  $L.warning($EVENT)
          - pattern: |
              try:
                  ...
              except $E as $X:
                  ...
                  $L.error($EVENT)
          - pattern: |
              try:
                  ...
              except $E as $X:
                  ...
                  $L.debug($EVENT)
  - id: intellicrack-logging-c2-missing-function-context-kwargs
    message: >-
      The enclosing function receives a well-known correlation argument (pid, process_name, binary_path, target, address, size, module_name, offset, session_id, bridge, tool_name, provider, script_id, probe_id, monitor_id, or hook_id) but this log call does not pass it as a kwarg. Logs without these keys cannot be correlated across the workspace. Add the relevant kwarg: `_logger.info("event_name", pid=pid, binary_path=str(binary_path))`.
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: |
              def $FN(..., pid, ...):
                  ...
                  $L.$LVL("$EVENT")
          - pattern: |
              def $FN(..., process_name, ...):
                  ...
                  $L.$LVL("$EVENT")
          - pattern: |
              def $FN(..., binary_path, ...):
                  ...
                  $L.$LVL("$EVENT")
          - pattern: |
              def $FN(..., target, ...):
                  ...
                  $L.$LVL("$EVENT")
          - pattern: |
              def $FN(..., address, ...):
                  ...
                  $L.$LVL("$EVENT")
          - pattern: |
              def $FN(..., session_id, ...):
                  ...
                  $L.$LVL("$EVENT")
          - pattern: |
              def $FN(..., tool_name, ...):
                  ...
                  $L.$LVL("$EVENT")
          - pattern: |
              def $FN(..., script_id, ...):
                  ...
                  $L.$LVL("$EVENT")
      - metavariable-regex:
          metavariable: $LVL
          regex: '^(info|warning|error|debug|exception|critical)$'
  - id: intellicrack-logging-c3-reserved-logrecord-key
    message: >-
      The kwarg name collides with a reserved LogRecord attribute (`name`, `message`, `msg`, `levelname`, `levelno`, `pathname`, `filename`, `module`, `lineno`, `funcName`, `created`, `msecs`, `relativeCreated`, `thread`, `threadName`, `processName`, `process`, `args`, or `asctime`). structlog/stdlib will either silently drop the kwarg or raise at format time. Rename to a project-specific key (e.g. `"name"` -> `"process_name"` or `"tool_name"`). `exc_info` / `exc_text` / `stack_info` are excluded because they are documented stdlib-logging kwargs consumed by the handler, not stored as fields.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: _logger.$LVL(..., $K=$X, ...)
          - pattern: self._logger.$LVL(..., $K=$X, ...)
          - pattern: logger.$LVL(..., $K=$X, ...)
          - pattern: self.logger.$LVL(..., $K=$X, ...)
          - pattern: cls._logger.$LVL(..., $K=$X, ...)
      - metavariable-regex:
          metavariable: $LVL
          regex: '^(info|warning|warn|error|debug|exception|critical|fatal|log)$'
      - metavariable-regex:
          metavariable: $K
          regex: '^(name|message|msg|levelname|levelno|pathname|filename|module|lineno|funcName|created|msecs|relativeCreated|thread|threadName|processName|args|asctime)$'
  - id: intellicrack-logging-c4-redundant-error-on-exception
    message: >-
      `_logger.exception(...)` already attaches the active traceback via `exc_info=True`. Passing `error=str(e)` duplicates that information and hides the type/traceback under a truncated string. Drop the `error=` kwarg and let `.exception()` capture it - keep only the structured context kwargs.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $L.exception(..., error=str($E), ...)
      - pattern: $L.exception(..., error=repr($E), ...)
      - pattern: $L.exception(..., error=$E, ...)
      - pattern: $L.exception(..., err=str($E), ...)
      - pattern: $L.exception(..., err=$E, ...)
      - pattern: $L.exception(..., exc=$E, ...)
      - pattern: $L.exception(..., exception=$E, ...)
      - pattern: $L.exception(..., traceback=$X, ...)
      - pattern: $L.exception(..., tb=$X, ...)
  - id: intellicrack-logging-c5-exception-call-outside-except
    message: >-
      `_logger.exception(...)` captures the active exception via `exc_info=True`. When called outside an `except:` block there is no active exception, so it logs `NoneType: None` or nothing at all - a useless record. If you want structured error reporting without a live traceback, use `_logger.error("event_name", error=str(e), error_type=type(e).__name__)`.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: _logger.exception(...)
          - pattern: self._logger.exception(...)
          - pattern: logger.exception(...)
          - pattern: self.logger.exception(...)
          - pattern: cls._logger.exception(...)
      - pattern-not-inside: |
          try:
