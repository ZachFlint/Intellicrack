  - id: intellicrack-logging-c6-raw-exception-as-kwarg-value
    message: >-
      A bare exception object is being logged as a kwarg value. Most renderers will call `repr()` on it, producing inconsistent output across exception types and losing chained-exception context. Log `error=str(e)` and `error_type=type(e).__name__` separately, or use `_logger.exception(...)` to capture the traceback.
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except $ET as $E:
                  ...
                  $L.$LVL(..., error=$E, ...)
          - pattern: |
              try:
                  ...
              except $ET as $E:
                  ...
                  $L.$LVL(..., err=$E, ...)
          - pattern: |
              try:
                  ...
              except $ET as $E:
                  ...
                  $L.$LVL(..., exception=$E, ...)
          - pattern: |
              try:
                  ...
              except $ET as $E:
                  ...
                  $L.$LVL(..., exc=$E, ...)
  - id: intellicrack-logging-c7-duplicated-data-in-event-and-kwargs
    message: >-
      The event-name string encodes data that is also passed as a kwarg (e.g. `f"attached pid={pid}"` next to `pid=pid`). Pick one - the structured kwarg is the source of truth because it is queryable. Make the event name a constant literal and keep the data in kwargs only.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $L.$LVL(f"...{$X}...", ..., $X=$X, ...)
      - pattern: $L.$LVL(f"...{$X}...", ..., $X=..., ...)
  - id: intellicrack-logging-c8-non-loggable-value-type
    message: >-
      The kwarg value is a raw bytes/bytearray/file/socket/Popen object that will render as a giant blob or opaque repr. Log metadata instead: `len(data)`, `path.name`, `sock.getpeername()`, `proc.pid`. Dumping the object itself bloats logs and leaks binary content into text aggregators.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $L.info(..., $K=open(...), ...)
      - pattern: $L.warning(..., $K=open(...), ...)
      - pattern: $L.error(..., $K=open(...), ...)
      - pattern: $L.debug(..., $K=open(...), ...)
