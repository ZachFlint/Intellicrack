  - id: intellicrack-logging-c4-redundant-error-on-exception
    message: >-
      `_logger.exception(...)` already attaches the active traceback
      via `exc_info=True`. Passing `error=str(e)` duplicates that
      information and hides the type/traceback under a truncated
      string. Drop the `error=` kwarg and let `.exception()` capture
      it - keep only the structured context kwargs.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $L.exception(..., error=str($E), ...)
      - pattern: $L.exception(..., error=repr($E), ...)
      - pattern: $L.exception(..., error=$E, ...)
      - pattern: $L.exception(..., err=str($E), ...)
      - pattern: $L.exception(..., err=$E, ...)
      - pattern: $L.exception(..., exc=$E, ...)
      - pattern: $L.exception(..., exception=$E, ...)
      - pattern: $L.exception(..., traceback=$X, ...)
      - pattern: $L.exception(..., tb=$X, ...)

  - id: intellicrack-logging-c5-exception-call-outside-except
    message: >-
      `_logger.exception(...)` captures the active exception via
      `exc_info=True`. When called outside an `except:` block there is
      no active exception, so it logs `NoneType: None` or nothing at
      all - a useless record. If you want structured error reporting
      without a live traceback, use `_logger.error("event_name",
      error=str(e), error_type=type(e).__name__)`.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: $L.exception(...)
      - pattern-not-inside: |
          try:
              ...
          except $E:
              ...
      - pattern-not-inside: |
          try:
              ...
          except $E as $X:
              ...
      - pattern-not-inside: |
          try:
              ...
          except:
              ...

  - id: intellicrack-logging-c6-raw-exception-as-kwarg-value
    message: >-
      A bare exception object is being logged as a kwarg value. Most
      renderers will call `repr()` on it, producing inconsistent output
      across exception types and losing chained-exception context. Log
      `error=str(e)` and `error_type=type(e).__name__` separately, or
      use `_logger.exception(...)` to capture the traceback.
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except $ET as $E:
                  ...
                  $L.$LVL(..., error=$E, ...)
          - pattern: |
              try:
                  ...
              except $ET as $E:
                  ...
                  $L.$LVL(..., err=$E, ...)
          - pattern: |
              try:
                  ...
              except $ET as $E:
                  ...
                  $L.$LVL(..., exception=$E, ...)
          - pattern: |
              try:
                  ...
              except $ET as $E:
                  ...
                  $L.$LVL(..., exc=$E, ...)

  - id: intellicrack-logging-c7-duplicated-data-in-event-and-kwargs
    message: >-
      The event-name string encodes data that is also passed as a
      kwarg (e.g. `f"attached pid={pid}"` next to `pid=pid`). Pick one
      - the structured kwarg is the source of truth because it is
      queryable. Make the event name a constant literal and keep the
      data in kwargs only.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $L.$LVL(f"...{$X}...", ..., $X=$X, ...)
      - pattern: $L.$LVL(f"...{$X}...", ..., $X=..., ...)

  - id: intellicrack-logging-c8-non-loggable-value-type
    message: >-
      The kwarg value is a raw bytes/bytearray/file/socket/Popen object
      that will render as a giant blob or opaque repr. Log metadata
      instead: `len(data)`, `path.name`, `sock.getpeername()`,
      `proc.pid`. Dumping the object itself bloats logs and leaks
      binary content into text aggregators.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $L.info(..., $K=open(...), ...)
      - pattern: $L.warning(..., $K=open(...), ...)
      - pattern: $L.error(..., $K=open(...), ...)
      - pattern: $L.debug(..., $K=open(...), ...)
      - pattern: $L.exception(..., $K=open(...), ...)
      - pattern: $L.critical(..., $K=open(...), ...)
      - pattern: $L.info(..., $K=subprocess.Popen(...), ...)
      - pattern: $L.warning(..., $K=subprocess.Popen(...), ...)
      - pattern: $L.error(..., $K=subprocess.Popen(...), ...)
      - pattern: $L.debug(..., $K=subprocess.Popen(...), ...)
      - pattern: $L.exception(..., $K=subprocess.Popen(...), ...)
      - pattern: $L.critical(..., $K=subprocess.Popen(...), ...)
      - pattern: $L.info(..., $K=Popen(...), ...)
      - pattern: $L.warning(..., $K=Popen(...), ...)
      - pattern: $L.error(..., $K=Popen(...), ...)
      - pattern: $L.debug(..., $K=Popen(...), ...)
      - pattern: $L.exception(..., $K=Popen(...), ...)
      - pattern: $L.critical(..., $K=Popen(...), ...)
      - pattern: $L.info(..., $K=socket.socket(...), ...)
      - pattern: $L.warning(..., $K=socket.socket(...), ...)
      - pattern: $L.error(..., $K=socket.socket(...), ...)
      - pattern: $L.debug(..., $K=socket.socket(...), ...)
      - pattern: $L.exception(..., $K=socket.socket(...), ...)
      - pattern: $L.critical(..., $K=socket.socket(...), ...)
      - pattern: $L.info(..., $K=bytearray(...), ...)
      - pattern: $L.warning(..., $K=bytearray(...), ...)
