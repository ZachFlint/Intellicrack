      - pattern: $L.debug(..., $K=bytearray(...), ...)
      - pattern: $L.exception(..., $K=bytearray(...), ...)
      - pattern: $L.critical(..., $K=bytearray(...), ...)
      - pattern: $L.info(..., $K=bytes(...), ...)
