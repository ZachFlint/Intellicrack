      - pattern: $L.error(..., message=$X, ...)
      - pattern: $L.debug(..., message=$X, ...)
      - pattern: $L.exception(..., message=$X, ...)
      - pattern: $L.critical(..., message=$X, ...)
      - pattern: $L.info(..., msg=$X, ...)
      - pattern: $L.warning(..., msg=$X, ...)
