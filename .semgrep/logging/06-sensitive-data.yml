  - id: intellicrack-logging-f6-high-entropy-literal-in-log
    message: >-
      A log kwarg value is a long high-entropy string literal. This is almost always a hardcoded secret (API key, token, password) that must not appear in code at all, let alone in logs. Move the secret into the credential store and reference it by key id, and never log its value.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: $L.info(..., $K=$V, ...)
      - pattern: $L.warning(..., $K=$V, ...)
      - pattern: $L.error(..., $K=$V, ...)
      - pattern: $L.debug(..., $K=$V, ...)
      - pattern: $L.exception(..., $K=$V, ...)
      - pattern: $L.critical(..., $K=$V, ...)
      - metavariable-regex:
          metavariable: $V
          regex: '^"[A-Za-z0-9+/=_\-]{32,}"$'
