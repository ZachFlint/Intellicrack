  - id: intellicrack-logging-f3-logging-http-auth-material
    message: >-
      Logging HTTP request/response authentication material (`request.headers`, `request.cookies`, `response.cookies`, `request.auth`, `session.auth`, `session.headers`). Auth headers and cookies contain bearer tokens, API keys, and session IDs. Log a redacted summary instead (e.g. header NAMES only).
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $L.info(..., $K=$R.headers, ...)
      - pattern: $L.warning(..., $K=$R.headers, ...)
      - pattern: $L.error(..., $K=$R.headers, ...)
      - pattern: $L.debug(..., $K=$R.headers, ...)
      - pattern: $L.exception(..., $K=$R.headers, ...)
      - pattern: $L.critical(..., $K=$R.headers, ...)
      - pattern: $L.info(..., $K=$R.cookies, ...)
      - pattern: $L.warning(..., $K=$R.cookies, ...)
      - pattern: $L.error(..., $K=$R.cookies, ...)
      - pattern: $L.debug(..., $K=$R.cookies, ...)
      - pattern: $L.exception(..., $K=$R.cookies, ...)
      - pattern: $L.critical(..., $K=$R.cookies, ...)
      - pattern: $L.info(..., $K=$R.auth, ...)
      - pattern: $L.warning(..., $K=$R.auth, ...)
      - pattern: $L.error(..., $K=$R.auth, ...)
      - pattern: $L.debug(..., $K=$R.auth, ...)
      - pattern: $L.exception(..., $K=$R.auth, ...)
      - pattern: $L.critical(..., $K=$R.auth, ...)
      - pattern: $L.info(..., $K=dict($R.headers), ...)
      - pattern: $L.warning(..., $K=dict($R.headers), ...)
      - pattern: $L.error(..., $K=dict($R.headers), ...)
      - pattern: $L.debug(..., $K=dict($R.headers), ...)
      - pattern: $L.exception(..., $K=dict($R.headers), ...)
      - pattern: $L.critical(..., $K=dict($R.headers), ...)
      - pattern: $L.info(..., $K=dict($R.cookies), ...)
      - pattern: $L.warning(..., $K=dict($R.cookies), ...)
