      - pattern: $L.critical(..., $K=dict($R.cookies), ...)
  - id: intellicrack-logging-f4-logging-http-body
    message: >-
      Logging raw HTTP response bodies (`response.text`, `response.content`, `response.json()`, `await response.text()`, `await response.json()`). Bodies frequently contain returned tokens, PII, or privileged data. Log `response.status_code`, `len(response.content)`, and a structured summary of known safe fields instead.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $L.info(..., $K=$R.text, ...)
      - pattern: $L.warning(..., $K=$R.text, ...)
      - pattern: $L.error(..., $K=$R.text, ...)
