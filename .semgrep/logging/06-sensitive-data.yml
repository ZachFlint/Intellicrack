  - id: intellicrack-logging-f5-logging-raw-bytes-payload
    message: >-
      Raw bytes/bytearray values are passed as a log kwarg. Emitting binary payloads through the log pipeline bloats records, breaks text aggregators, and may leak target-binary contents or shared memory state. Log metadata: `size=len(data)`, `sha256=...`, optionally a hex prefix `head_hex=data[:16].hex()`.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $L.info(..., data=$D, ...)
      - pattern: $L.warning(..., data=$D, ...)
      - pattern: $L.error(..., data=$D, ...)
      - pattern: $L.debug(..., data=$D, ...)
      - pattern: $L.exception(..., data=$D, ...)
      - pattern: $L.critical(..., data=$D, ...)
      - pattern: $L.info(..., buffer=$D, ...)
      - pattern: $L.warning(..., buffer=$D, ...)
      - pattern: $L.error(..., buffer=$D, ...)
      - pattern: $L.debug(..., buffer=$D, ...)
      - pattern: $L.exception(..., buffer=$D, ...)
      - pattern: $L.critical(..., buffer=$D, ...)
      - pattern: $L.info(..., buf=$D, ...)
      - pattern: $L.warning(..., buf=$D, ...)
      - pattern: $L.error(..., buf=$D, ...)
      - pattern: $L.debug(..., buf=$D, ...)
      - pattern: $L.exception(..., buf=$D, ...)
      - pattern: $L.critical(..., buf=$D, ...)
      - pattern: $L.info(..., payload=$D, ...)
      - pattern: $L.warning(..., payload=$D, ...)
      - pattern: $L.error(..., payload=$D, ...)
      - pattern: $L.debug(..., payload=$D, ...)
      - pattern: $L.exception(..., payload=$D, ...)
      - pattern: $L.critical(..., payload=$D, ...)
      - pattern: $L.info(..., bytes=$D, ...)
      - pattern: $L.warning(..., bytes=$D, ...)
      - pattern: $L.error(..., bytes=$D, ...)
      - pattern: $L.debug(..., bytes=$D, ...)
      - pattern: $L.exception(..., bytes=$D, ...)
