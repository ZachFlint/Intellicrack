  - id: intellicrack-logging-f2-logging-environment-variable
    message: >-
      `os.environ[...]` / `os.getenv(...)` values are logged directly. Environment variables are the canonical home for secrets (`OPENAI_API_KEY`, `ANTHROPIC_API_KEY`, GitHub tokens, etc.). Never dump environ values into logs. Log only the variable NAME if you need to record what was looked up.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $L.info(..., $K=os.environ[...], ...)
      - pattern: $L.warning(..., $K=os.environ[...], ...)
      - pattern: $L.error(..., $K=os.environ[...], ...)
      - pattern: $L.debug(..., $K=os.environ[...], ...)
      - pattern: $L.exception(..., $K=os.environ[...], ...)
      - pattern: $L.critical(..., $K=os.environ[...], ...)
      - pattern: $L.info(..., $K=os.environ.get(...), ...)
      - pattern: $L.warning(..., $K=os.environ.get(...), ...)
      - pattern: $L.error(..., $K=os.environ.get(...), ...)
      - pattern: $L.debug(..., $K=os.environ.get(...), ...)
      - pattern: $L.exception(..., $K=os.environ.get(...), ...)
      - pattern: $L.critical(..., $K=os.environ.get(...), ...)
      - pattern: $L.info(..., $K=os.getenv(...), ...)
      - pattern: $L.warning(..., $K=os.getenv(...), ...)
