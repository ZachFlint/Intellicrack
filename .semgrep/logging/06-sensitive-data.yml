rules:
  - id: intellicrack-logging-f1-sensitive-kwarg-name
    message: >-
      Log call uses a kwarg whose name strongly implies a secret value (password, passwd, pwd, api_key, apikey, secret, token, bearer, authorization, auth_header, credential, private_key, ssh_key, pem, cookie, session_cookie, csrf, refresh_token, access_token, client_secret). Logging secrets leaks credentials through log aggregators, archives, and incident exports. If you need to correlate on a secret, log a masked prefix or a hash: `token_prefix=token[:4], token_sha256=hashlib.sha256(token).hexdigest()[:12]`.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $L.info(..., password=$X, ...)
          - pattern: $L.warning(..., password=$X, ...)
          - pattern: $L.error(..., password=$X, ...)
          - pattern: $L.debug(..., password=$X, ...)
          - pattern: $L.exception(..., password=$X, ...)
          - pattern: $L.critical(..., password=$X, ...)
          - pattern: $L.info(..., passwd=$X, ...)
