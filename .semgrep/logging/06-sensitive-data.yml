      - pattern: $L.debug(..., raw=$D, ...)
      - pattern: $L.exception(..., raw=$D, ...)
      - pattern: $L.critical(..., raw=$D, ...)
      - pattern: $L.info(..., content=$D, ...)
      - pattern: $L.warning(..., content=$D, ...)
      - pattern: $L.error(..., content=$D, ...)
      - pattern: $L.debug(..., content=$D, ...)
      - pattern: $L.exception(..., content=$D, ...)
      - pattern: $L.critical(..., content=$D, ...)
