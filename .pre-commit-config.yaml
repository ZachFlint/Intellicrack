repos:
  # Rust Quality Assurance (intellicrack-hexcore crate)
  - repo: https://github.com/doublify/pre-commit-rust
    rev: eeee35a89e69d5772bdee97db1a6a898467b686e # pragma: allowlist secret
    hooks:
      - id: cargo-check
        args: ['--manifest-path', 'src/intellicrack-hexcore/Cargo.toml']
        name: Rust cargo check
      - id: clippy
        args: ['--manifest-path', 'src/intellicrack-hexcore/Cargo.toml', '--all-targets', '--', '-W', 'clippy::all', '-W', 'clippy::pedantic']
        name: Rust clippy linting
  - repo: local
    hooks:
      - id: clean-nul-files
        name: Clean NUL Files (Windows artifact cleanup)
        entry: pixi run python scripts/clean_nul.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: generate-requirements
        name: Generate requirements.txt from pixi environment
        entry: bash -c 'pixi run python scripts/generate_requirements.py && git add requirements.txt'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: generate-structure-files
        name: Generate Intellicrack Structure Files (HTA/TXT)
        entry: bash -c 'pixi run python scripts/generate_tree.py'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: generate-knowledge-graph
        name: Generate Intellicrack Knowledge Graph
        entry: bash -c 'pixi run python scripts/knowledge-graph/visualize_architecture.py --layout hierarchical'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: rust-fmt
        name: Rust code formatting (cargo fmt)
        entry: cargo fmt --manifest-path src/intellicrack-hexcore/Cargo.toml -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: test-coverage-modified
        name: Test Coverage (Modified Files - 80% minimum)
        entry: pixi run python -m pytest --cov=intellicrack --cov-fail-under=80 --cov-report=term-missing
        language: system
        pass_filenames: false
        files: '^src/intellicrack/.*\.py$'
        stages: [manual]
      - id: test-real-functionality-modified
        name: Test Real Functionality (Modified Files)
        entry: pixi run python -m pytest tests/ -k "not slow" --tb=short
        language: system
        pass_filenames: false
        files: '^src/intellicrack/.*\.py$'
        stages: [manual]
      - id: test-coverage-full
        # Full audit hooks for manual execution

        name: Full Codebase Test Coverage (80% minimum)
        entry: pixi run python -m pytest --cov=intellicrack --cov-fail-under=80 --cov-report=term-missing --cov-report=html
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Code Quality - Advanced Linting & Formatting (Updated to Latest)

    rev: v0.12.11
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    # Security - Secret Scanning (Up to date)

    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
  - repo: https://github.com/PyCQA/bandit
    # Security - Vulnerability Scanning (Updated)

    rev: 1.8.3
    hooks:
      - id: bandit
        args: ['-r', 'src/intellicrack/', '-ll', '-i']
        pass_filenames: false
        exclude: ^tests/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # Basic Git Hygiene (Updated to Latest)

    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=10000']
      - id: check-ast
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=crlf']
        exclude: '^pixi\.lock$'
      - id: fix-byte-order-marker
